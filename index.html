<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #070508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 35px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.4); letter-spacing: 4px; font-size: 13px;
            pointer-events: none; text-transform: uppercase; animation: fadeIn 3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let structures = [];
    let fallingObjects = [];

    // Edle Pink- und Rosatöne (Zentrum und Rand für Farbverläufe)
    const palettes = [
        { stem: '#2b3a2c', branch: '#4c6b53', c1: '#ffffff', c2: '#ff69b4' }, // Weiß zu Hot Pink
        { stem: '#331a28', branch: '#592e47', c1: '#ffe4e1', c2: '#c71585' }, // Zartrosa zu Violett-Pink
        { stem: '#2c1b22', branch: '#603347', c1: '#ffb6c1', c2: '#ff1493' }, // Hellrosa zu Deep Pink
        { stem: '#201f26', branch: '#413c4d', c1: '#fff0f5', c2: '#db7093' }, // Lavendel-Weiß zu Altrosa
        { stem: '#1d261e', branch: '#3c5240', c1: '#f8c8dc', c2: '#9e1b4c' }  // Puderrosa zu Wein-Pink
    ];

    class FallingPetal {
        constructor(x, y, color1, color2, size, type) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 5; 
            this.vy = (Math.random() - 1) * 2 - 1; 
            this.gravity = 0.15;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.1;
            this.size = size * (0.3 + Math.random() * 0.3);
            this.color1 = color1;
            this.color2 = color2;
            this.type = type;
        }
        update() {
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.rotSpeed;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            
            // Kleiner Verlauf auch für fallende Blätter
            let grad = ctx.createLinearGradient(0, 0, 0, this.size);
            grad.addColorStop(0, this.color1);
            grad.addColorStop(1, this.color2);
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.ellipse(0, this.size/2, this.size*0.4, this.size, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- DIE PFLANZEN-KLASSE ---

    class UniquePlant {
        constructor(startX, startY, angle, length, width, depth, dna) {
            this.startX = startX; this.startY = startY; 
            this.angle = angle; this.length = length;
            this.width = width; this.depth = depth; 
            this.dna = dna;
            
            this.progress = 0; // Ast-Wachstum
            this.bloomProgress = 0; // Blüten-Wachstum (Animation)
            this.speed = 0.015 + Math.random() * 0.015; 
            
            this.children = [];
            this.hasGrownChildren = false;
            
            this.curve = (Math.random() - 0.5) * dna.curviness; 
            this.endX = this.startX; 
            this.endY = this.startY;
        }

        update() {
            // 1. Ast wächst
            if (this.progress < 1) {
                this.progress += this.speed;
                if (this.progress > 1) this.progress = 1;
            } 
            
            // 2. Wenn Ast fertig, wachsen Kinder oder Blüte
            if (this.progress >= 1) {
                this.endX = this.startX + Math.cos(this.angle + this.curve) * this.length;
                this.endY = this.startY + Math.sin(this.angle + this.curve) * this.length;
                
                // Entweder verzweigen...
                if (!this.hasGrownChildren && this.depth < this.dna.maxDepth) {
                    this.hasGrownChildren = true;
                    // Kleinere und weniger Äste, damit die Blüten Platz haben
                    let branches = this.depth === this.dna.maxDepth - 1 ? 0 : (Math.random() > 0.4 ? 2 : 1);
                    for (let i = 0; i < branches; i++) {
                        let newAngle = this.angle + (Math.random() - 0.5) * 1.6;
                        let newLength = this.length * (0.6 + Math.random() * 0.2);
                        this.children.push(new UniquePlant(this.endX, this.endY, newAngle, newLength, this.width * 0.7, this.depth + 1, this.dna));
                    }
                }

                // ...oder Blüte aufpoppen lassen
                if (this.depth >= this.dna.bloomStartDepth) {
                    if (this.bloomProgress < 1) {
                        this.bloomProgress += 0.025; // Geschwindigkeit des Aufblühens
                        if (this.bloomProgress > 1) this.bloomProgress = 1;
                    }
                }
            }

            this.children.forEach(child => child.update());
        }

        draw() {
            let curX = this.startX + Math.cos(this.angle + this.curve) * this.length * this.progress;
            let curY = this.startY + Math.sin(this.angle + this.curve) * this.length * this.progress;
            
            // Stängel zeichnen
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            let cpX = (this.startX + curX) / 2 + Math.sin(this.angle) * 10;
            let cpY = (this.startY + curY) / 2 + Math.cos(this.angle) * 10;
            ctx.quadraticCurveTo(cpX, cpY, curX, curY);

            ctx.strokeStyle = this.depth < 1 ? this.dna.palette.stem : this.dna.palette.branch;
            ctx.lineWidth = Math.max(0.4, this.width);
            ctx.stroke();

            // Kinder zeichnen
            this.children.forEach(child => child.draw());

            // Riesige, hochdetaillierte Blüte mit Aufblüh-Animation zeichnen
            if (this.bloomProgress > 0 && this.depth >= this.dna.bloomStartDepth) {
                let isMainBloom = (this.depth === this.dna.maxDepth);
                let finalSize = isMainBloom ? this.dna.bloomSize * 1.6 : this.dna.bloomSize * 0.8;
                
                // Sanftes "Aufploppen" (Ease-Out Kurve)
                let animatedSize = finalSize * Math.sin(this.bloomProgress * Math.PI / 2);
                
                this.drawDetailedBloom(curX, curY, animatedSize);
            }
        }

        drawDetailedBloom(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(this.angle + Math.PI/2); // Blüte blickt in Wuchsrichtung

            // Blütenschichten (hinten nach vorne)
            for (let layer = 0; layer < this.dna.layers; layer++) {
                let layerSize = size * (1 - layer * 0.25);
                let pCount = this.dna.petalCount;

                ctx.rotate(Math.PI / pCount); // Schichten leicht verdrehen

                // Wunderschöner Farbverlauf pro Blüte
                let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, layerSize);
                let cInner = layer % 2 === 0 ? this.dna.color1 : this.dna.color2;
                let cOuter = layer % 2 === 0 ? this.dna.color2 : this.dna.color1;
                grad.addColorStop(0, cInner);
                grad.addColorStop(1, cOuter);
                ctx.fillStyle = grad;
                
                // Feine Umrandung der Blütenblätter für realistische Details
                ctx.lineWidth = 0.5;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';

                for (let i = 0; i < pCount; i++) {
                    ctx.save();
                    ctx.rotate((Math.PI * 2 / pCount) * i);
                    ctx.beginPath();
                    
                    let w = layerSize * this.dna.petalWidth;
                    let h = layerSize;

                    // Absolute Unikate durch verschiedene Blütenformen
                    if (this.dna.petalType === 0) {
                        // Lotus / Lilien Form (spitz)
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(w, h * 0.5, 0, h);
                        ctx.quadraticCurveTo(-w, h * 0.5, 0, 0);
                    } else if (this.dna.petalType === 1) {
                        // Pfingstrose / Rose (rund, füllig)
                        ctx.moveTo(0, 0);
                        ctx.bezierCurveTo(w * 1.5, h * 0.4, w, h * 0.9, 0, h);
                        ctx.bezierCurveTo(-w, h * 0.9, -w * 1.5, h * 0.4, 0, 0);
                    } else if (this.dna.petalType === 2) {
                        // Kirschblüte (eingekerbt)
                        ctx.moveTo(0, 0);
                        ctx.bezierCurveTo(w, h * 0.4, w * 0.8, h, 0, h * 0.8);
                        ctx.bezierCurveTo(-w * 0.8, h, -w, h * 0.4, 0, 0);
                    } else {
                        // Nelke (flach und leicht eckig am Rand)
                        ctx.moveTo(0, 0);
                        ctx.bezierCurveTo(w, h * 0.3, w * 0.8, h * 0.9, w * 0.3, h);
                        ctx.lineTo(-w * 0.3, h);
                        ctx.bezierCurveTo(-w * 0.8, h * 0.9, -w, h * 0.3, 0, 0);
                    }
                    
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Realistische Staubgefäße (Pistils) im Zentrum
            let stamenCount = this.dna.stamens;
            for (let i = 0; i < stamenCount; i++) {
                let a = (Math.PI * 2 / stamenCount) * i + Math.random()*0.2;
                let d = size * 0.25;
                
                // Filamente (dünne Stiele)
                ctx.strokeStyle = 'rgba(255, 220, 100, 0.6)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d);
                ctx.stroke();

                // Antheren (goldene Pollen-Köpfe)
                ctx.fillStyle = '#ffda75';
                ctx.beginPath();
                ctx.arc(Math.cos(a) * d, Math.sin(a) * d, size * 0.05, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }

    function generateBotanicDNA() {
        let p = palettes[Math.floor(Math.random() * palettes.length)];
        return {
            palette: p, color1: p.c1, color2: p.c2,
            maxDepth: Math.floor(Math.random() * 2) + 3, // Kürzere Pflanzen = mehr Fokus auf Blüten
            curviness: Math.random() * 0.8 + 0.2,
            bloomStartDepth: 2, 
            bloomSize: Math.random() * 12 + 18, // Extrem große Blüten!
            petalType: Math.floor(Math.random() * 4), // 4 radikal verschiedene Formen
            petalCount: Math.floor(Math.random() * 7) + 5, // 5 bis 11 Blätter
            petalWidth: Math.random() * 0.4 + 0.3, // Schmal bis extrem bauchig
            layers: Math.floor(Math.random() * 2) + 2, // 2 oder 3 Schichten
            stamens: Math.floor(Math.random() * 12) + 8 // 8 bis 20 Gold-Punkte
        };
    }

    function spawnStructure(x, y) {
        let dna = generateBotanicDNA();
        let mainAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.5;
        // Stamm ist kürzer, Blüte wirkt massiver
        structures.push(new UniquePlant(x, y, mainAngle, 50 + Math.random() * 30, 3.5, 0, dna));
        
        // Verhindert, dass die Seite zu voll wird und ruckelt (Max 12 Pflanzen)
        if (structures.length > 12) structures.shift();
    }

    // --- SCHÜTTEL-EFFEKT (Blütenblätter fliegen davon) ---

    function breakIntoLeaves(plant) {
        if (plant.bloomProgress > 0) {
            // Generiert viele Blätter pro Blüte
            for(let i=0; i < plant.dna.petalCount * plant.dna.layers; i++) {
                fallingObjects.push(new FallingPetal(
                    plant.endX + (Math.random()-0.5)*20, 
                    plant.endY + (Math.random()-0.5)*20, 
                    plant.dna.color1, plant.dna.color2, 
                    plant.dna.bloomSize, plant.dna.petalType
                ));
            }
        }
        plant.children.forEach(c => breakIntoLeaves(c));
    }

    function triggerShake() {
        if(structures.length === 0) return;
        structures.forEach(s => breakIntoLeaves(s));
        structures = []; 
    }

    // --- INTERAKTIONEN ---

    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        if (now - lastTap < 300) { triggerShake(); lastTap = 0; return; }
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnStructure(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('dblclick', triggerShake);

    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 25) triggerShake();
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }

    // --- KLARE, GESTOCHEN SCHARFE ANIMATION ---

    function animate() {
        // Komplett schwarzer Hintergrund statt weichem Fade -> Maximale Details der Blüten!
        ctx.fillStyle = '#070508'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        structures.forEach(s => {
            s.update();
            s.draw();
        });

        for(let i = fallingObjects.length - 1; i >= 0; i--) {
            let obj = fallingObjects[i];
            obj.update();
            obj.draw();
            if (obj.y > canvas.height + 50) {
                fallingObjects.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
