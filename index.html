<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Infinite Aesthetic Flora</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            /* Ein extrem tiefes, mystisches Dunkelgrau für perfekten Kontrast */
            background: radial-gradient(circle at center, #18191c 0%, #08090a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.2); letter-spacing: 7px; font-size: 11px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let windPetals = [];

    // --- 1. DYNAMISCHE BLÜTEN-GENERIERUNG (Pre-Rendering pro Pflanze) ---
    // Diese Funktion malt in Sekundenbruchteilen ein absolutes Unikat
    function createFlowerTexture(hue, shapeType) {
        let size = 200; // Sehr hohe Auflösung
        let offCanvas = document.createElement('canvas');
        offCanvas.width = size; offCanvas.height = size;
        let oCtx = offCanvas.getContext('2d');
        let center = size / 2;

        oCtx.translate(center, center);

        let layers, petalsPerLayer;
        
        if (shapeType === 0) {
            // Typ 0: LOTUS (Spitz, elegant, mehrschichtig)
            layers = 4; petalsPerLayer = 8;
            for (let l = layers; l > 0; l--) {
                let r = (size*0.45) * (l/layers);
                oCtx.fillStyle = `hsla(${hue}, 90%, ${30 + (l*12)}%, 0.9)`;
                oCtx.strokeStyle = `hsla(${hue}, 100%, 80%, 0.5)`;
                oCtx.lineWidth = 1;
                
                let offset = (Math.PI*2/petalsPerLayer) * 0.5 * l;
                for (let p = 0; p < petalsPerLayer; p++) {
                    oCtx.save();
                    oCtx.rotate((Math.PI*2/petalsPerLayer)*p + offset);
                    let w = r * 0.35;
                    oCtx.beginPath(); oCtx.moveTo(0,0);
                    oCtx.quadraticCurveTo(w, r*0.5, 0, r);
                    oCtx.quadraticCurveTo(-w, r*0.5, 0, 0);
                    oCtx.fill(); oCtx.stroke();
                    oCtx.restore();
                }
            }
        } 
        else if (shapeType === 1) {
            // Typ 1: SAKURA (5 Blätter, eingekerbt, sanft)
            layers = 2; petalsPerLayer = 5;
            for (let l = layers; l > 0; l--) {
                let r = (size*0.4) * (l/layers);
                oCtx.fillStyle = `hsla(${hue}, 80%, ${50 + (l*15)}%, 0.85)`;
                
                let offset = (Math.PI*2/petalsPerLayer) * 0.5 * l;
                for (let p = 0; p < petalsPerLayer; p++) {
                    oCtx.save();
                    oCtx.rotate((Math.PI*2/petalsPerLayer)*p + offset);
                    let w = r * 0.6;
                    oCtx.beginPath(); oCtx.moveTo(0,0);
                    oCtx.bezierCurveTo(w, r*0.4, w*0.9, r, 0, r*0.8); // Die Einkerbung
                    oCtx.bezierCurveTo(-w*0.9, r, -w, r*0.4, 0, 0);
                    oCtx.fill();
                    
                    // Zarte Adern
                    oCtx.strokeStyle = `hsla(${hue}, 50%, 90%, 0.4)`;
                    oCtx.lineWidth = 1;
                    oCtx.beginPath(); oCtx.moveTo(0,0); oCtx.lineTo(0, r*0.5); oCtx.stroke();
                    oCtx.restore();
                }
            }
        }
        else if (shapeType === 2) {
            // Typ 2: CHRYSANTHEME / SPIDER (Hunderte feine, lange Nadeln)
            layers = 1; petalsPerLayer = 45;
            for (let p = 0; p < petalsPerLayer; p++) {
                let r = (size*0.45) * (0.5 + Math.random()*0.5);
                oCtx.save();
                oCtx.rotate((Math.PI*2/petalsPerLayer)*p + (Math.random()-0.5)*0.2);
                
                let grad = oCtx.createLinearGradient(0,0,0,r);
                grad.addColorStop(0, `hsla(${hue}, 100%, 70%, 1)`);
                grad.addColorStop(1, `hsla(${hue}, 100%, 30%, 0.8)`);
                oCtx.fillStyle = grad;
                
                let w = r * 0.08; // Hauchdünn
                let curve = (Math.random()-0.5)*r*0.5; // Leicht gebogen
                
                oCtx.beginPath(); oCtx.moveTo(0,0);
                oCtx.quadraticCurveTo(w + curve, r*0.5, curve, r);
                oCtx.quadraticCurveTo(-w + curve, r*0.5, 0, 0);
                oCtx.fill();
                oCtx.restore();
            }
        }
        else if (shapeType === 3) {
            // Typ 3: PFINGSTROSE (Riesig, weich, transparent, gewellt)
            layers = 3; petalsPerLayer = 6;
            for (let l = layers; l > 0; l--) {
                let r = (size*0.45) * (l/layers);
                oCtx.fillStyle = `hsla(${hue}, 70%, ${40 + (l*15)}%, 0.7)`; // Stark transparent
                oCtx.strokeStyle = `hsla(${hue}, 100%, 80%, 0.5)`;
                oCtx.lineWidth = 1.5;
                
                let offset = (Math.PI*2/petalsPerLayer) * Math.random();
                for (let p = 0; p < petalsPerLayer; p++) {
                    oCtx.save();
                    oCtx.rotate((Math.PI*2/petalsPerLayer)*p + offset);
                    let w = r * 1.2; // Sehr breit
                    oCtx.beginPath(); oCtx.moveTo(0,0);
                    oCtx.bezierCurveTo(w, r*0.2, w*0.8, r*0.9, 0, r);
                    oCtx.bezierCurveTo(-w*0.8, r*0.9, -w, r*0.2, 0, 0);
                    oCtx.fill(); oCtx.stroke();
                    oCtx.restore();
                }
            }
        }

        // Goldenes Zentrum für alle
        oCtx.fillStyle = '#ffda75';
        for(let s=0; s<15; s++) {
            let a = Math.random() * Math.PI*2;
            let d = Math.random() * (size * 0.08);
            oCtx.beginPath(); oCtx.arc(Math.cos(a)*d, Math.sin(a)*d, 2.5, 0, Math.PI*2); oCtx.fill();
        }

        return offCanvas;
    }

    // --- 2. FALLENDE BLÄTTER ---
    class WindPetal {
        constructor(x, y, hue) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 1) * 3 - 1;
            this.gravity = 0.1;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.15;
            this.size = 6 + Math.random() * 6;
            this.hue = hue;
            this.flip = Math.random() * Math.PI;
            this.flipSpeed = 0.03 + Math.random() * 0.05;
        }
        update() {
            this.vy += this.gravity; this.x += this.vx; this.y += this.vy;
            this.rotation += this.rotSpeed; this.flip += this.flipSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.scale(Math.sin(this.flip), 1);
            ctx.fillStyle = `hsla(${this.hue}, 80%, 60%, 0.8)`;
            ctx.beginPath(); ctx.moveTo(0,-this.size);
            ctx.quadraticCurveTo(this.size, 0, 0, this.size);
            ctx.quadraticCurveTo(-this.size, 0, 0, -this.size);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- 3. DIE EINZELNE BLÜTE AUF DEM BAUM ---
    class PlantBloom {
        constructor(x, y, angle, size, texture) {
            this.x = x; this.y = y; this.angle = angle;
            this.targetSize = size * (0.6 + Math.random()*0.6);
            this.texture = texture; // Das generierte Unikat-Bild
            this.progress = 0;
            this.delay = Math.random() * 0.3;
        }
        update(globalProgress) {
            if (globalProgress > this.delay && this.progress < 1) {
                this.progress += 0.03; 
                if (this.progress > 1) this.progress = 1;
            }
        }
        draw(ctx) {
            if (this.progress <= 0) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            
            // Wunderschöner, organischer "Plopp"-Effekt
            let bounce = Math.sin(this.progress * Math.PI / 2) * (1 + 0.15 * Math.sin(this.progress * Math.PI));
            let finalScale = (this.targetSize / 200) * bounce; 
            
            ctx.scale(finalScale, finalScale);
            // Rendert das vorgeladene Unikat blitzschnell
            ctx.drawImage(this.texture, -100, -100); 
            ctx.restore();
        }
    }

    // --- 4. DER ÄSTHETISCHE, ORGANISCHE BAUM ---
    class AestheticTree {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.branches = []; 
            this.blooms = [];   
            this.globalProgress = 0; 
            
            // GANZ NEU: Jeder Baum bekommt eine komplett eigene, zufällige Farbe (0 bis 360) und Form (0 bis 3)
            this.hue = Math.floor(Math.random() * 360);
            this.shapeType = Math.floor(Math.random() * 4);
            
            // Erstelle das Textur-Unikat für DIESEN Baum
            this.flowerTexture = createFlowerTexture(this.hue, this.shapeType);
            
            // Die Farbe des Stammes passt sich der Blüte an (Sehr dunkel und edel)
            this.stemColor = `hsla(${this.hue}, 30%, 10%, 1)`; 
            
            let baseAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.2;
            
            // Baut die komplette fraktale Struktur auf
            this.generateBranch(this.x, this.y, baseAngle, 120 + Math.random()*50, 20, 0, 4);
            
            // Sortiert kleine Blüten nach hinten
            this.blooms.sort((a, b) => a.targetSize - b.targetSize);
        }

        generateBranch(startX, startY, angle, length, width, depth, maxDepth) {
            // Fraktales Wachstum in Segmenten für mehr Organik (Zittern und Kurven)
            let segments = 6;
            let curX = startX; let curY = startY;
            let curAngle = angle;
            
            let delay = depth * 0.15;
            let branchPath = [{x: curX, y: curY}];

            for(let i=1; i<=segments; i++) {
                // Ast verbiegt sich leicht organisch
                curAngle += (Math.random() - 0.5) * 0.3;
                let segLen = length / segments;
                curX += Math.cos(curAngle) * segLen;
                curY += Math.sin(curAngle) * segLen;
                branchPath.push({x: curX, y: curY});
            }

            this.branches.push({
                path: branchPath,
                w: width, 
                delay: delay
            });

            // Verzweigungen
            if (depth < maxDepth) {
                // 2 bis 3 neue Äste fächern sich extrem weit auf
                let numBranches = depth === 0 ? 3 : (2 + Math.floor(Math.random() * 2));
                
                for (let i = 0; i < numBranches; i++) {
                    let newAngle = curAngle + (Math.random() - 0.5) * 1.8;
                    let newLen = length * (0.6 + Math.random() * 0.2);
                    let newWidth = width * 0.65;
                    this.generateBranch(curX, curY, newAngle, newLen, newWidth, depth + 1, maxDepth);
                }
                
                // Viele kleine Blüten an den Seiten der Äste
                if (depth > 0) {
                    let sideBlooms = 2 + Math.floor(Math.random()*3);
                    for(let k=0; k<sideBlooms; k++) {
                        let pt = branchPath[Math.floor(Math.random() * (branchPath.length-1)) + 1];
                        this.blooms.push(new PlantBloom(pt.x + (Math.random()-0.5)*15, pt.y + (Math.random()-0.5)*15, curAngle + Math.random()*Math.PI, 20 + Math.random()*15, this.flowerTexture));
                    }
                }
            } else {
                // Prunkvolle Blütenkronen an den Enden der Äste
                let numBlooms = 4 + Math.floor(Math.random()*4); 
                for(let b = 0; b < numBlooms; b++) {
                    let bAngle = curAngle + (Math.random()-0.5)*3;
                    let offsetX = curX + (Math.random()-0.5)*35;
                    let offsetY = curY + (Math.random()-0.5)*35;
                    let size = 35 + Math.random()*30; // Riesig!
                    this.blooms.push(new PlantBloom(offsetX, offsetY, bAngle, size, this.flowerTexture));
                }
            }
        }

        update() {
            if (this.globalProgress < 1.5) { this.globalProgress += 0.015; } 
            this.blooms.forEach(b => b.update(this.globalProgress - 0.5)); 
        }

        drawStems(ctx) {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            this.branches.forEach(b => {
                if (this.globalProgress > b.delay) {
                    let p = Math.min(1, (this.globalProgress - b.delay) * 4); 
                    
                    // Zeichnet den organischen Pfad
                    let pointsToDraw = Math.max(1, Math.floor(p * b.path.length));
                    
                    // Die pure Ästhetik: Eine tiefdunkle, glatte Silhouette
                    ctx.beginPath();
                    ctx.moveTo(b.path[0].x, b.path[0].y);
                    for(let i=1; i<pointsToDraw; i++) {
                        ctx.lineTo(b.path[i].x, b.path[i].y);
                    }
                    
                    ctx.strokeStyle = this.stemColor;
                    ctx.lineWidth = b.w;
                    ctx.stroke();
                }
            });
        }

        drawBlooms(ctx) {
            this.blooms.forEach(b => b.draw(ctx));
        }

        shatter(arr) {
            this.blooms.forEach(b => {
                if (b.progress > 0.5) {
                    let count = 3 + Math.floor(Math.random()*4);
                    for(let i=0; i<count; i++) {
                        arr.push(new WindPetal(b.x, b.y, this.hue));
                    }
                }
            });
        }
    }

    function spawnPlant(x, y) {
        plants.push(new AestheticTree(x, y));
        // Durch Pre-Rendering bleiben bis zu 12 dieser gigantischen Bäume ruckelfrei!
        if (plants.length > 12) plants.shift(); 
    }

    function triggerClear() {
        if(plants.length === 0) return;
        plants.forEach(p => p.shatter(windPetals));
        plants = []; 
    }

    // --- 5. EINGABEN ---
    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        if (now - lastTap < 100) return; 
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnPlant(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('touchstart', handleTouch, {passive: true});

    // --- 6. SCHÜTTEL-ERKENNUNG ---
    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 25) {
                triggerClear();
            }
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }
    
    window.addEventListener('dblclick', triggerClear);

    // --- 7. FLÜSSIGER RENDER LOOP ---
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        plants.forEach(p => p.update());
        
        // Erst alle Stämme (Tiefschwarze, extrem edle Silhouetten)
        plants.forEach(p => p.drawStems(ctx));
        // Dann die farbenprächtigen Blüten darüber
        plants.forEach(p => p.drawBlooms(ctx));

        // Herabfallende Blütenblätter
        for(let i = windPetals.length - 1; i >= 0; i--) {
            let wp = windPetals[i];
            wp.update();
            wp.draw(ctx);
            if (wp.y > canvas.height + 100) windPetals.splice(i, 1);
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
