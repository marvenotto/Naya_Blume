<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Für Naya</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08080a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .dedication {
            position: absolute;
            bottom: 35px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 5px;
            font-size: 12px;
            font-weight: 300;
            pointer-events: none;
            text-transform: uppercase;
            animation: fadeIn 3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let structures = [];
    let fallingElements = [];

    // Edle, erwachsene Farbpaletten
    const palettes = [
        { stem: '#3a5a40', primary: '#d4a373', secondary: '#faedcd', accent: '#ccd5ae' }, // Natur & Gold
        { stem: '#2b2d42', primary: '#ef233c', secondary: '#8d99ae', accent: '#edf2f4' }, // Tiefes Rot & Schiefer
        { stem: '#4a4e69', primary: '#c9ada7', secondary: '#9a8c98', accent: '#f2e9e4' }, // Rauchiges Altrosa & Flieder
        { stem: '#1b4332', primary: '#74c69d', secondary: '#b7e4c7', accent: '#d8f3dc' }, // Eukalyptus & Mint
        { stem: '#3b2f2f', primary: '#e0a96d', secondary: '#f4acb7', accent: '#ffb5a7' }  // Warmes Braun & Puderrosa
    ];

    class ComplexBranch {
        constructor(x, y, angle, length, width, depth, palette, type) {
            this.x = x;
            this.y = y;
            this.angle = angle;
            this.length = length;
            this.width = width;
            this.depth = depth;
            this.progress = 0;
            this.speed = 0.015 + Math.random() * 0.02;
            this.children = [];
            this.hasGrownChildren = false;
            this.palette = palette;
            this.type = type; // Bestimmt die Wachstumsstruktur (Fraktal, Weide, Distel etc.)
            this.curve = (Math.random() - 0.5) * 0.8;
        }

        update() {
            if (this.progress < 1) {
                this.progress += this.speed;
                if (this.progress > 1) this.progress = 1;
            } else if (!this.hasGrownChildren && this.depth < 7) { // Maximale Komplexität bis Tiefe 7
                this.hasGrownChildren = true;
                let endX = this.x + Math.cos(this.angle + this.curve) * this.length;
                let endY = this.y + Math.sin(this.angle + this.curve) * this.length;
                
                // Unterschiedliche Verzweigungs-Logik je nach Pflanzen-Typ
                let branchesCount = 2;
                if (this.type === 'fraktal') branchesCount = 2;
                if (this.type === 'strauch') branchesCount = 3;
                if (this.type === 'filigran') branchesCount = (Math.random() > 0.4 ? 2 : 3);

                for (let i = 0; i < branchesCount; i++) {
                    let spread = this.type === 'fraktal' ? 0.8 : 1.4;
                    let newAngle = this.angle + (i - (branchesCount - 1) / 2) * spread + (Math.random() - 0.5) * 0.3;
                    let newLength = this.length * (0.65 + Math.random() * 0.2);
                    this.children.push(new ComplexBranch(endX, endY, newAngle, newLength, this.width * 0.62, this.depth + 1, this.palette, this.type));
                }
            }
            this.children.forEach(child => child.update());
        }

        draw() {
            let curX = this.x + Math.cos(this.angle + this.curve) * this.length * this.progress;
            let curY = this.y + Math.sin(this.angle + this.curve) * this.length * this.progress;

            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            
            // Organischer Bogen
            let cpX = (this.x + curX) / 2 + Math.sin(this.angle) * 15;
            let cpY = (this.y + curY) / 2 + Math.cos(this.angle) * 15;
            ctx.quadraticCurveTo(cpX, cpY, curX, curY);

            // Farbgebung nach Tiefe abstufen für realistische Tiefenwirkung
            if (this.depth === 0) {
                ctx.strokeStyle = this.palette.stem;
            } else if (this.depth < 3) {
                ctx.strokeStyle = this.palette.secondary;
            } else {
                ctx.strokeStyle = this.palette.primary;
            }

            ctx.lineWidth = Math.max(0.25, this.width);
            ctx.stroke();

            // Feine, kristalline Strukturen an den absoluten Spitzen (statt runden Punkten)
            if (this.progress >= 1 && this.depth >= 4) {
                ctx.strokeStyle = this.palette.accent;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(curX, curY);
                ctx.lineTo(curX + (Math.random() - 0.5) * 6, curY + (Math.random() - 0.5) * 6);
                ctx.stroke();
            }

            this.children.forEach(child => child.draw());
        }
    }

    class FallingParticle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 1) * 3 - 1;
            this.gravity = 0.25;
            this.rotation = Math.random() * Math.PI;
            this.vRot = (Math.random() - 0.5) * 0.08;
            this.color = color;
        }
        update() {
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.vRot;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.color;
            ctx.fillRect(-1.5, -1.5, 3, 3); // Kleine feine Partikel statt Kreise
            ctx.restore();
        }
    }

    function spawnStructure(x, y) {
        let palette = palettes[Math.floor(Math.random() * palettes.length)];
        let types = ['fraktal', 'strauch', 'filigran'];
        let type = types[Math.floor(Math.random() * types.length)];

        let mainAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.5;
        let root = new ComplexBranch(x, y, mainAngle, 90 + Math.random() * 40, 2.2, 0, palette, type);
        structures.push(root);
    }

    function triggerClear() {
        structures.forEach(s => {
            fallingElements.push(new FallingParticle(s.x, s.y, s.palette.primary));
        });
        structures = [];
    }

    // Eingaben
    window.addEventListener('pointerdown', (e) => {
        spawnStructure(e.clientX, e.clientY);
    });

    let lastTap = 0;
    window.addEventListener('touchend', (e) => {
        let time = new Date().getTime();
        if (time - lastTap < 300 && time - lastTap > 0) triggerClear();
        lastTap = time;
    });
    window.addEventListener('dblclick', triggerClear);

    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 26) {
                triggerClear();
            }
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }

    function animate() {
        ctx.fillStyle = 'rgba(8, 8, 10, 0.2)'; // Sanfter Fade-Hintergrund
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        structures.forEach(s => {
            s.update();
            s.draw();
        });

        fallingElements.forEach((f, idx) => {
            f.update();
            f.draw();
            if (f.y > canvas.height + 30) fallingElements.splice(idx, 1);
        });

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
