<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Generative Art</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #030204; /* Sehr tiefes, fast schwarzes Violett für extremen Kontrast */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.2); letter-spacing: 6px; font-size: 11px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let particles = [];

    // Professionelle, erwachsene Farbpaletten (Aquarell-Look)
    const palettes = [
        { stem: '#2a332a', inner: '#fff0f5', outer: '#ff69b4', edge: 'rgba(255,255,255,0.4)' }, // Klassisch Rosa
        { stem: '#30222a', inner: '#ffe4e1', outer: '#c71585', edge: 'rgba(255,200,200,0.3)' }, // Tiefes Magenta
        { stem: '#222622', inner: '#ffdab9', outer: '#ff1493', edge: 'rgba(255,230,200,0.4)' }, // Pfirsich zu Deep Pink
        { stem: '#1d1a24', inner: '#f8f8ff', outer: '#db7093', edge: 'rgba(255,255,255,0.5)' }  // Zartes Altrosa
    ];

    // --- FALLENDE BLÜTENBLÄTTER (Phyllotaxis-Stil) ---
    class FallingPetal {
        constructor(x, y, colorInner, colorOuter) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 3;
            this.vy = (Math.random() - 1) * 2;
            this.gravity = 0.05 + Math.random() * 0.05;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.05;
            this.size = Math.random() * 15 + 10;
            this.colorOuter = colorOuter;
            this.colorInner = colorInner;
        }
        update() {
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.rotSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            
            let grad = ctx.createLinearGradient(0, 0, this.size, 0);
            grad.addColorStop(0, this.colorInner);
            grad.addColorStop(1, this.colorOuter);
            ctx.fillStyle = grad;
            ctx.globalAlpha = 0.7;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(this.size*0.5, this.size*0.3, this.size, this.size*0.5, this.size*1.2, 0);
            ctx.bezierCurveTo(this.size, -this.size*0.5, this.size*0.5, -this.size*0.3, 0, 0);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- DIE NEUE BOTANIK-ENGINE ---
    class ProfessionalBloom {
        constructor(x, y, angle, size, palette, isMain) {
            this.x = x; this.y = y;
            this.baseAngle = angle;
            this.targetSize = isMain ? size * (1.2 + Math.random()*0.4) : size * (0.5 + Math.random()*0.3);
            this.palette = palette;
            this.progress = 0;
            this.petals = [];
            
            this.generatePhyllotaxis();
        }

        // Generiert Blätter nach dem Goldenen Schnitt (Natur-Mathematik)
        generatePhyllotaxis() {
            let numPetals = Math.floor(40 + Math.random() * 40); // Bis zu 80 Blätter pro Blüte!
            let goldenAngle = 137.5 * (Math.PI / 180);
            
            for (let i = 1; i <= numPetals; i++) {
                // Radius und Winkel für die Spirale
                let r = Math.sqrt(i) * (this.targetSize / Math.sqrt(numPetals));
                let theta = i * goldenAngle + this.baseAngle;
                
                // Äußere Blätter sind groß und breit, innere sind klein und gebogen
                let petalLen = (this.targetSize - r * 0.4) * (0.8 + Math.random() * 0.4);
                let petalWidth = petalLen * (0.4 + Math.random() * 0.3);
                
                this.petals.push({
                    r: r,
                    theta: theta,
                    len: petalLen,
                    width: petalWidth,
                    // Verzögerung: Äußere Blätter wachsen zuerst, dann die inneren
                    delay: 1 - (i / numPetals) 
                });
            }
            // Sortieren, damit äußere Blätter zuerst gezeichnet werden (Tiefenwirkung)
            this.petals.sort((a, b) => b.r - a.r);
        }

        update() {
            if (this.progress < 1) {
                this.progress += 0.015; // Elegantes, langsames Aufblühen
                if (this.progress > 1) this.progress = 1;
            }
        }

        draw(ctx) {
            if (this.progress === 0) return;

            ctx.save();
            ctx.translate(this.x, this.y);

            // Jedes Blütenblatt einzeln mit extremen Details zeichnen
            this.petals.forEach(p => {
                // Berechne, wie weit dieses spezielle Blatt gewachsen ist
                let pGrowth = Math.max(0, Math.min(1, (this.progress - p.delay * 0.5) * 2));
                if (pGrowth <= 0) return;

                // Sanfte Kurve beim Öffnen der Blüte (Ease-Out)
                let easeGrowth = 1 - Math.pow(1 - pGrowth, 3);
                
                ctx.save();
                ctx.rotate(p.theta);
                
                // Verschiebung von der Mitte nach außen (Goldene Spirale)
                ctx.translate(p.r * easeGrowth, 0);

                // Farbverlauf: Innen hell und leuchtend, außen tief und kräftig
                let grad = ctx.createLinearGradient(0, 0, p.len * easeGrowth, 0);
                grad.addColorStop(0, this.palette.inner);
                grad.addColorStop(1, this.palette.outer);
                
                ctx.fillStyle = grad;
                // Aquarell-Transparenz-Effekt
                ctx.globalAlpha = 0.85;

                // Gezeichnete Pfade statt simpler Kreise
                ctx.beginPath();
                ctx.moveTo(0, 0);
                
                // Asymmetrische, organische Blatt-Kanten
                let w = p.width * easeGrowth;
                let l = p.len * easeGrowth;
                
                ctx.bezierCurveTo(l*0.3, w*0.8, l*0.7, w*0.9, l, 0);
                ctx.bezierCurveTo(l*0.7, -w*0.7, l*0.3, -w*0.6, 0, 0);
                
                ctx.fill();
                
                // Zarte, helle Kontur für den filigranen Look
                ctx.strokeStyle = this.palette.edge;
                ctx.lineWidth = 0.5;
                ctx.stroke();
                
                // Winzige Blattadern zur Mitte hin
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.quadraticCurveTo(l*0.4, w*0.1, l*0.7, 0);
                ctx.stroke();

                ctx.restore();
            });

            // Goldene, komplexe Staubgefäße im Zentrum
            if (this.progress > 0.5) {
                let centerAlpha = (this.progress - 0.5) * 2;
                ctx.globalAlpha = centerAlpha;
                for(let i=0; i<15; i++) {
                    let angle = Math.random() * Math.PI * 2;
                    let dist = Math.random() * (this.targetSize * 0.15);
                    
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.lineTo(Math.cos(angle)*dist, Math.sin(angle)*dist);
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.arc(Math.cos(angle)*dist, Math.sin(angle)*dist, 1.2, 0, Math.PI*2);
                    ctx.fillStyle = '#ffda75';
                    ctx.fill();
                }
            }
            ctx.restore();
        }
    }

    class OrganicBranch {
        constructor(startX, startY, angle, length, width, depth, palette, isMain) {
            this.startX = startX; this.startY = startY; 
            this.angle = angle; this.length = length;
            this.width = width; this.depth = depth; 
            this.palette = palette;
            this.isMain = isMain;
            
            this.progress = 0; 
            this.speed = 0.01 + Math.random() * 0.008; // Sehr natürliches, ruhiges Wachstum
            
            this.children = [];
            this.bloom = null;
            this.isFinished = false;
            
            // Meander-Kurve für realistische Stängel
            this.curve = (Math.random() - 0.5) * 0.8; 
            this.endX = this.startX; 
            this.endY = this.startY;
        }

        update() {
            if (this.progress < 1) {
                this.progress += this.speed;
                if (this.progress > 1) this.progress = 1;
            } 
            
            if (this.progress >= 1 && !this.isFinished) {
                this.isFinished = true;
                this.endX = this.startX + Math.cos(this.angle + this.curve) * this.length;
                this.endY = this.startY + Math.sin(this.angle + this.curve) * this.length;
                
                // Bis zu 4 Ebenen Tiefe für enorme Komplexität
                if (this.depth < 4 && Math.random() < 0.8) {
                    
                    // Hauptast fortsetzen (wächst hoch)
                    let mainAngle = this.angle + (Math.random() - 0.5) * 0.4;
                    let mainLen = this.length * (0.7 + Math.random() * 0.2);
                    this.children.push(new OrganicBranch(this.endX, this.endY, mainAngle, mainLen, this.width * 0.65, this.depth + 1, this.palette, true));
                    
                    // Filigrane, lange Nebenäste
                    let sideCount = Math.random() > 0.3 ? 2 : 1;
                    for (let i = 0; i < sideCount; i++) {
                        let sideAngle = this.angle + (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random() * 0.7);
                        let sideLen = this.length * (0.5 + Math.random() * 0.4); 
                        this.children.push(new OrganicBranch(this.endX, this.endY, sideAngle, sideLen, this.width * 0.4, this.depth + 1, this.palette, false));
                    }
                } else {
                    // Erschaffe eine hochprofessionelle Blüte am Ende des Astes
                    let bloomSize = 25 + Math.random() * 15;
                    this.bloom = new ProfessionalBloom(this.endX, this.endY, this.angle, bloomSize, this.palette, this.isMain);
                }
            }

            this.children.forEach(c => c.update());
            if (this.bloom) this.bloom.update();
        }

        drawStems(ctx) {
            let curX = this.startX + Math.cos(this.angle + this.curve) * this.length * this.progress;
            let curY = this.startY + Math.sin(this.angle + this.curve) * this.length * this.progress;
            
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            let cpX = (this.startX + curX) / 2 + Math.sin(this.angle) * 15;
            let cpY = (this.startY + curY) / 2 + Math.cos(this.angle) * 15;
            ctx.quadraticCurveTo(cpX, cpY, curX, curY);

            ctx.strokeStyle = this.palette.stem;
            ctx.lineWidth = Math.max(0.2, this.width); // Extrem feine Linien an den Spitzen
            ctx.globalAlpha = 1;
            ctx.stroke();

            this.children.forEach(c => c.drawStems(ctx));
        }

        drawBlooms(ctx) {
            if (this.bloom) this.bloom.draw(ctx);
            this.children.forEach(c => c.drawBlooms(ctx));
        }

        collectLeaves(arr) {
            if (this.bloom && this.bloom.progress > 0) {
                let count = this.isMain ? 20 : 8; 
                for(let i=0; i < count; i++) {
                    arr.push(new FallingPetal(
                        this.bloom.x + (Math.random()-0.5)*20, 
                        this.bloom.y + (Math.random()-0.5)*20, 
                        this.palette.inner, this.palette.outer
                    ));
                }
            }
            this.children.forEach(c => c.collectLeaves(arr));
        }
    }

    class PlantSystem {
        constructor(x, y) {
            let p = palettes[Math.floor(Math.random() * palettes.length)];
            let mainAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.3;
            // Der Hauptstamm: Elegant, organisch und sehr verästelt
            this.root = new OrganicBranch(x, y, mainAngle, 80 + Math.random() * 40, 2.8, 0, p, true);
        }
        update() { this.root.update(); }
        drawStems(ctx) { this.root.drawStems(ctx); }
        drawBlooms(ctx) { this.root.drawBlooms(ctx); }
        breakDown(arr) { this.root.collectLeaves(arr); }
    }

    function spawnStructure(x, y) {
        plants.push(new PlantSystem(x, y));
        // Max 6 Pflanzen gleichzeitig, da jede Pflanze nun Hunderte Polygone berechnet!
        if (plants.length > 6) plants.shift(); 
    }

    function triggerShake() {
        if(plants.length === 0) return;
        plants.forEach(p => p.breakDown(particles));
        plants = []; 
    }

    // --- INTERAKTIONEN ---
    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        if (now - lastTap < 300) { triggerShake(); lastTap = 0; return; }
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnStructure(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('dblclick', triggerShake);

    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 20) triggerShake();
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }

    // --- ANIMATION LOOP ---
    function animate() {
        // Tiefer, reiner Hintergrund für maximalen Kontrast (Kein Verwischen mehr!)
        ctx.fillStyle = '#030204'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        plants.forEach(p => p.update());
        
        // Zuerst alle Zweige im Hintergrund
        plants.forEach(p => p.drawStems(ctx));
        
        // Dann die komplexen Blüten im Vordergrund
        // ctx.globalCompositeOperation = 'lighter'; // (Optional: Macht die Blüten leuchtender)
        plants.forEach(p => p.drawBlooms(ctx));
        ctx.globalCompositeOperation = 'source-over'; 

        for(let i = particles.length - 1; i >= 0; i--) {
            let obj = particles[i];
            obj.update();
            obj.draw(ctx);
            if (obj.y > canvas.height + 50) {
                particles.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
