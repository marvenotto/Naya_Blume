<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - High-End Floral Art</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #151118 0%, #050406 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.3); letter-spacing: 6px; font-size: 11px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let windPetals = [];

    // Basisfarben als HSL (Farbton). Damit können wir für jede Blüte die Farbe leicht variieren!
    const palettes = [
        { bark: '#1a1617', baseHue: 335, hueVar: 25 }, // Kirschblüte (Pink zu Magenta)
        { bark: '#14171a', baseHue: 310, hueVar: 30 }, // Mystisches Violett/Rosa
        { bark: '#171410', baseHue: 350, hueVar: 20 }  // Warmes Lachsrosa/Rot
    ];

    // --- FREI FALLENDE BLÜTENBLÄTTER ---
    class WindPetal {
        constructor(x, y, hue) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 1) * 3 - 2;
            this.gravity = 0.15;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.15;
            this.size = 4 + Math.random() * 4;
            this.hue = hue;
            this.flip = Math.random() * Math.PI;
            this.flipSpeed = 0.05 + Math.random() * 0.05;
        }
        update() {
            this.vy += this.gravity;
            this.x += this.vx; this.y += this.vy;
            this.rotation += this.rotSpeed;
            this.flip += this.flipSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.scale(Math.sin(this.flip), 1);
            
            let grad = ctx.createLinearGradient(0, 0, 0, this.size);
            grad.addColorStop(0, `hsla(${this.hue}, 90%, 80%, 0.9)`);
            grad.addColorStop(1, `hsla(${this.hue}, 80%, 50%, 0.7)`);
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.bezierCurveTo(this.size, this.size*0.3, this.size*0.5, this.size, 0, this.size);
            ctx.bezierCurveTo(-this.size*0.5, this.size, -this.size, this.size*0.3, 0, 0);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- DIE FEINEN, DETAILREICHEN BLÜTEN ---
    class DetailBloom {
        constructor(x, y, angle, baseHue, depthLevel) {
            this.x = x; this.y = y; this.angle = angle;
            
            // Tiefe entscheidet über Größe und Helligkeit
            this.depthLevel = depthLevel; // 0 = Vordergrund, tiefer = Hintergrund
            this.maxSize = (7 + Math.random() * 5) * (1 - this.depthLevel * 0.15); 
            
            // JEDE Blüte bekommt einen eigenen, leicht abweichenden Farbton
            this.hue = baseHue + (Math.random() - 0.5) * 35; 
            // Hintergrundblüten sind dunkler (weniger Lightness)
            this.lightness = 75 - (this.depthLevel * 10); 
            
            this.progress = 0;
            this.delay = Math.random() * 0.5; // Leicht versetztes Aufblühen
            
            this.petalCount = 5 + Math.floor(Math.random() * 3);
            this.layers = 2 + Math.floor(Math.random() * 2);
        }

        update(globalProgress) {
            if (globalProgress > this.delay) {
                if (this.progress < 1) {
                    this.progress += 0.025; // Öffnet sich weich
                    if (this.progress > 1) this.progress = 1;
                }
            }
        }

        draw(ctx) {
            if (this.progress <= 0) return;

            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            // Organisches Federn beim Aufgehen
            let scale = Math.sin(this.progress * Math.PI / 2);
            ctx.scale(scale, scale);

            for (let l = this.layers; l > 0; l--) {
                let layerSize = this.maxSize * (l / this.layers);
                let pCount = this.petalCount;
                
                let cInner = `hsla(${this.hue}, 90%, ${this.lightness + 15}%, 0.95)`;
                let cOuter = `hsla(${this.hue}, 85%, ${this.lightness - 15}%, 0.8)`;
                
                let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, layerSize);
                grad.addColorStop(0, cInner);
                grad.addColorStop(1, cOuter);
                
                ctx.fillStyle = grad;
                
                let offset = (Math.PI * 2 / pCount) * 0.5 * l;
                for (let i = 0; i < pCount; i++) {
                    ctx.save();
                    ctx.rotate((Math.PI * 2 / pCount) * i + offset);
                    
                    let w = layerSize * 0.6;
                    let s = layerSize;
                    
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    // Feine, leicht eckige Blütenform für mehr Detailtiefe
                    ctx.bezierCurveTo(w, s*0.4, w*0.8, s, 0, s*0.9);
                    ctx.bezierCurveTo(-w*0.8, s, -w, s*0.4, 0, 0);
                    ctx.fill();
                    
                    // Zarte Blattadern
                    ctx.strokeStyle = `hsla(${this.hue}, 50%, 90%, 0.3)`;
                    ctx.lineWidth = 0.3;
                    ctx.beginPath();
                    ctx.moveTo(0,0); ctx.lineTo(0, s*0.7);
                    ctx.stroke();
                    
                    ctx.restore();
                }
            }

            // Filigrane Staubgefäße (nur sichtbar bei großen Blüten im Vordergrund)
            if (this.progress > 0.6 && this.maxSize > 5) {
                ctx.globalAlpha = (this.progress - 0.6) * 2;
                for(let i=0; i<6; i++) {
                    let a = Math.random() * Math.PI*2;
                    let d = Math.random() * (this.maxSize * 0.35);
                    ctx.strokeStyle = `hsla(${this.hue}, 80%, 40%, 0.8)`;
                    ctx.lineWidth = 0.4;
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*d, Math.sin(a)*d); ctx.stroke();
                    
                    ctx.fillStyle = '#ffda75'; // Goldenes Zentrum
                    ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, 0.8, 0, Math.PI*2); ctx.fill();
                }
            }
            ctx.restore();
        }
    }

    // --- DER FILIGRANE STRAUCH ---
    class OrganicBush {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.palette = palettes[Math.floor(Math.random() * palettes.length)];
            
            this.branches = []; 
            this.blooms = [];   
            this.globalProgress = 0; 
            this.isFinished = false;
            
            let baseAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.3;
            // Erstellt die Fraktal-Struktur (Tief bis zu Ebene 5)
            this.generateBranch(this.x, this.y, baseAngle, 70 + Math.random()*30, 8, 0, 5);
            
            // Blüten sortieren, damit kleine, dunkle hinten (zuerst) gezeichnet werden
            this.blooms.sort((a, b) => b.depthLevel - a.depthLevel);
        }

        generateBranch(startX, startY, angle, length, width, depth, maxDepth) {
            let endX = startX + Math.cos(angle) * length;
            let endY = startY + Math.sin(angle) * length;
            
            let delay = depth * 0.15; // Wachstumsverzögerung pro Ebene
            
            // Speichert die Ast-Linie mit organischem Schwung (Bezier)
            let cpX = (startX + endX)/2 + (Math.random()-0.5)*length*0.3;
            let cpY = (startY + endY)/2 + (Math.random()-0.5)*length*0.3;
            
            this.branches.push({
                x1: startX, y1: startY, cpX: cpX, cpY: cpY, x2: endX, y2: endY,
                w: width, delay: delay
            });

            if (depth < maxDepth) {
                // Je dünner der Ast, desto mehr verzweigt er sich (2 bis 4 neue Äste)
                let numBranches = depth === 0 ? 2 : (2 + Math.floor(Math.random()*2));
                
                for (let i = 0; i < numBranches; i++) {
                    let newAngle = angle + (Math.random() - 0.5) * 1.5;
                    let newLen = length * (0.5 + Math.random() * 0.3);
                    let newWidth = width * 0.6;
                    this.generateBranch(endX, endY, newAngle, newLen, newWidth, depth + 1, maxDepth);
                }
            } else {
                // Wenn Ast aufhört: Einen dichten Cluster aus vielen Blüten generieren
                let numBlooms = 2 + Math.floor(Math.random()*3); // 2-4 Blüten pro Astende
                for(let b = 0; b < numBlooms; b++) {
                    let bAngle = angle + (Math.random()-0.5)*2;
                    let offsetX = endX + (Math.random()-0.5)*15;
                    let offsetY = endY + (Math.random()-0.5)*15;
                    // Zufällige Tiefen-Ebene (0 = vorne/groß, 3 = hinten/klein)
                    let dLevel = Math.random() * 3; 
                    
                    this.blooms.push(new DetailBloom(offsetX, offsetY, bAngle, this.palette.baseHue, dLevel));
                }
            }
        }

        update() {
            if (this.globalProgress < 2) { 
                this.globalProgress += 0.015; 
            } else {
                this.isFinished = true;
            }
            this.blooms.forEach(b => b.update(this.globalProgress - 0.8)); // Blüten starten, wenn Äste fast fertig sind
        }

        drawStems(ctx) {
            ctx.lineCap = 'round';
            this.branches.forEach(b => {
                if (this.globalProgress > b.delay) {
                    let p = Math.min(1, (this.globalProgress - b.delay) * 5); // Schnelles Astwachstum
                    
                    // Berechnet den aktuellen Endpunkt entlang der Bezier-Kurve
                    let curX = Math.pow(1-p, 2)*b.x1 + 2*(1-p)*p*b.cpX + Math.pow(p,2)*b.x2;
                    let curY = Math.pow(1-p, 2)*b.y1 + 2*(1-p)*p*b.cpY + Math.pow(p,2)*b.y2;
                    let curCpX = (b.x1 + curX)/2;
                    let curCpY = (b.y1 + curY)/2;

                    ctx.beginPath();
                    ctx.moveTo(b.x1, b.y1);
                    ctx.quadraticCurveTo(curCpX, curCpY, curX, curY);
                    
                    ctx.strokeStyle = this.palette.bark;
                    ctx.lineWidth = b.w;
                    ctx.stroke();
                }
            });
        }

        drawBlooms(ctx) {
            this.blooms.forEach(b => b.draw(ctx));
        }

        shatter(arr) {
            this.blooms.forEach(b => {
                if (b.progress > 0.5) {
                    // Erzeugt 3 bis 6 Blätter pro Blüte, die wegfliegen
                    let count = 3 + Math.floor(Math.random()*3);
                    for(let i=0; i<count; i++) {
                        arr.push(new WindPetal(b.x, b.y, b.hue));
                    }
                }
            });
        }
    }

    function spawnPlant(x, y) {
        plants.push(new OrganicBush(x, y));
        // Erhöhtes Limit: Bis zu 15 Pflanzen gleichzeitig auf dem Bildschirm!
        if (plants.length > 15) plants.shift(); 
    }

    // Löst das Kunstwerk in einem riesigen Regen aus Blütenblättern auf
    function triggerClear() {
        if(plants.length === 0) return;
        plants.forEach(p => p.shatter(windPetals));
        plants = []; // Löscht alle Pflanzen
    }

    // --- EINGABEN ---
    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        // Das Doppeltippen löst NICHT mehr das Auflösen aus. (Stört beim vielen Pflanzen)
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnPlant(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);

    // --- SCHÜTTEL-ERKENNUNG (Der einzige Weg, um die Pflanzen aufzulösen) ---
    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            // Reagiert auf kräftiges Schütteln
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 25) {
                triggerClear();
            }
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }
    
    // Fallback für den PC (Doppelklick löst auch auf, da man den PC nicht schütteln kann)
    window.addEventListener('dblclick', triggerClear);

    // --- RENDER LOOP ---
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        plants.forEach(p => p.update());
        
        // Erst alle Äste zeichnen (liegen im Hintergrund)
        plants.forEach(p => p.drawStems(ctx));
        
        // Dann alle Blüten darüber
        plants.forEach(p => p.drawBlooms(ctx));

        // Schüttel-Effekt (Herabfallende Blätter)
        for(let i = windPetals.length - 1; i >= 0; i--) {
            let wp = windPetals[i];
            wp.update();
            wp.draw(ctx);
            if (wp.y > canvas.height + 50) windPetals.splice(i, 1);
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
