<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #050406; /* Noch dunkler, damit das Rosa strahlt */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 35px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.3); letter-spacing: 5px; font-size: 12px;
            pointer-events: none; text-transform: uppercase; animation: fadeIn 4s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let fallingObjects = [];

    // Transluzente, extrem filigrane Farbpaletten
    const palettes = [
        { stem: 'rgba(50, 70, 55, 0.8)', c1: 'rgba(255, 255, 255, 0.85)', c2: 'rgba(255, 105, 180, 0.75)' }, 
        { stem: 'rgba(60, 40, 55, 0.8)', c1: 'rgba(255, 228, 225, 0.85)', c2: 'rgba(199, 21, 133, 0.75)' },
        { stem: 'rgba(45, 30, 40, 0.8)', c1: 'rgba(255, 182, 193, 0.85)', c2: 'rgba(255, 20, 147, 0.75)' },
        { stem: 'rgba(40, 45, 50, 0.8)', c1: 'rgba(248, 200, 220, 0.85)', c2: 'rgba(216, 112, 147, 0.75)' }
    ];

    class FallingPetal {
        constructor(x, y, color1, color2, size, type) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 4; 
            this.vy = (Math.random() - 1) * 2 - 0.5; 
            this.gravity = 0.1;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.05;
            this.size = size * (0.3 + Math.random() * 0.3);
            this.color1 = color1;
            this.color2 = color2;
        }
        update() {
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.rotSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            
            let grad = ctx.createLinearGradient(0, 0, 0, this.size);
            grad.addColorStop(0, this.color1);
            grad.addColorStop(1, this.color2);
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.ellipse(0, this.size/2, this.size*0.4, this.size, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- FILIGRANER ZWEIG ---

    class Branch {
        constructor(startX, startY, angle, length, width, depth, dna, isMain) {
            this.startX = startX; this.startY = startY; 
            this.angle = angle; this.length = length;
            this.width = width; this.depth = depth; 
            this.dna = dna;
            this.isMain = isMain; // Hauptast oder Nebenast (für unterschiedliche Höhen/Tiefen)
            
            this.progress = 0; 
            this.bloomProgress = 0; 
            // Feinere Äste wachsen etwas langsamer, organischer
            this.speed = 0.01 + Math.random() * 0.01; 
            
            this.children = [];
            this.isFinished = false;
            this.hasBloom = false;
            
            this.curve = (Math.random() - 0.5) * dna.curviness; 
            this.endX = this.startX; 
            this.endY = this.startY;
        }

        update() {
            if (this.progress < 1) {
                this.progress += this.speed;
                if (this.progress > 1) this.progress = 1;
            } 
            
            if (this.progress >= 1 && !this.isFinished) {
                this.isFinished = true;
                this.endX = this.startX + Math.cos(this.angle + this.curve) * this.length;
                this.endY = this.startY + Math.sin(this.angle + this.curve) * this.length;
                
                // Organisches Verzweigen: Wachse weiter, wenn Max-Tiefe nicht erreicht
                if (this.depth < this.dna.maxDepth && Math.random() < 0.85) {
                    
                    // 1 Hauptast (wächst weiter nach oben)
                    let mainAngle = this.angle + (Math.random() - 0.5) * 0.5;
                    let mainLen = this.length * (0.7 + Math.random() * 0.2);
                    this.children.push(new Branch(this.endX, this.endY, mainAngle, mainLen, this.width * 0.6, this.depth + 1, this.dna, true));
                    
                    // 1 bis 2 kleine Nebenäste (zweigen zur Seite ab, bleiben kürzer)
                    let sideCount = Math.random() > 0.4 ? 2 : 1;
                    for (let i = 0; i < sideCount; i++) {
                        let sideAngle = this.angle + (Math.random() > 0.5 ? 1 : -1) * (0.6 + Math.random() * 0.8);
                        let sideLen = this.length * (0.4 + Math.random() * 0.3); // Bewusst kürzer für Tiefenwirkung!
                        this.children.push(new Branch(this.endX, this.endY, sideAngle, sideLen, this.width * 0.4, this.depth + 1, this.dna, false));
                    }
                } else {
                    // Wenn Ast aufhört zu wachsen -> Blüte!
                    this.hasBloom = true;
                }
            }

            // Blüte animieren
            if (this.hasBloom && this.bloomProgress < 1) {
                this.bloomProgress += 0.02;
                if (this.bloomProgress > 1) this.bloomProgress = 1;
            }

            this.children.forEach(c => c.update());
        }

        // Schritt 1: Nur die feinen Stängel zeichnen
        drawStems(ctx) {
            let curX = this.startX + Math.cos(this.angle + this.curve) * this.length * this.progress;
            let curY = this.startY + Math.sin(this.angle + this.curve) * this.length * this.progress;
            
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            let cpX = (this.startX + curX) / 2 + Math.sin(this.angle) * 15;
            let cpY = (this.startY + curY) / 2 + Math.cos(this.angle) * 15;
            ctx.quadraticCurveTo(cpX, cpY, curX, curY);

            ctx.strokeStyle = this.dna.palette.stem;
            // Extrem filigrane Liniendicke
            ctx.lineWidth = Math.max(0.15, this.width);
            ctx.stroke();

            this.children.forEach(c => c.drawStems(ctx));
        }

        // Schritt 2: Nur die Blüten zeichnen (liegen so perfekt AUF den Ästen)
        drawBlooms(ctx) {
            if (this.hasBloom && this.bloomProgress > 0) {
                // Hauptäste bekommen riesige Blüten, Nebenäste zarte Knospen
                let finalSize = this.isMain ? this.dna.bloomSize : this.dna.bloomSize * 0.5;
                
                // Weiche Animation durch Sinus-Kurve
                let animatedSize = finalSize * Math.sin(this.bloomProgress * Math.PI / 2);
                
                let curX = this.startX + Math.cos(this.angle + this.curve) * this.length * this.progress;
                let curY = this.startY + Math.sin(this.angle + this.curve) * this.length * this.progress;
                
                this.drawDetailedBloom(ctx, curX, curY, animatedSize);
            }
            this.children.forEach(c => c.drawBlooms(ctx));
        }

        drawDetailedBloom(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(this.angle + Math.PI/2); 

            for (let layer = 0; layer < this.dna.layers; layer++) {
                let layerSize = size * (1 - layer * 0.25);
                let pCount = this.dna.petalCount;

                ctx.rotate(Math.PI / pCount); 

                let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, layerSize);
                let cInner = layer % 2 === 0 ? this.dna.color1 : this.dna.color2;
                let cOuter = layer % 2 === 0 ? this.dna.color2 : this.dna.color1;
                grad.addColorStop(0, cInner);
                grad.addColorStop(1, cOuter);
                ctx.fillStyle = grad;
                
                ctx.lineWidth = 0.3;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';

                for (let i = 0; i < pCount; i++) {
                    ctx.save();
                    ctx.rotate((Math.PI * 2 / pCount) * i);
                    
                    // Umriss des Blütenblattes
                    ctx.beginPath();
                    let w = layerSize * this.dna.petalWidth;
                    let h = layerSize;

                    if (this.dna.petalType === 0) {
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(w, h * 0.5, 0, h);
                        ctx.quadraticCurveTo(-w, h * 0.5, 0, 0);
                    } else if (this.dna.petalType === 1) {
                        ctx.moveTo(0, 0);
                        ctx.bezierCurveTo(w * 1.5, h * 0.4, w, h * 0.9, 0, h);
                        ctx.bezierCurveTo(-w, h * 0.9, -w * 1.5, h * 0.4, 0, 0);
                    } else if (this.dna.petalType === 2) {
                        ctx.moveTo(0, 0);
                        ctx.bezierCurveTo(w, h * 0.4, w * 0.8, h, 0, h * 0.8);
                        ctx.bezierCurveTo(-w * 0.8, h, -w, h * 0.4, 0, 0);
                    }
                    ctx.fill();
                    
                    // --- NEU: Filigrane, zarte Blattadern zeichnen ---
                    ctx.beginPath();
                    ctx.lineWidth = 0.15; // Hauchdünn
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    // Hauptader in der Mitte
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, h * 0.7);
                    // Feine Seitenadern
                    ctx.moveTo(0, h * 0.2); ctx.quadraticCurveTo(w*0.3, h*0.4, w*0.4, h*0.5);
                    ctx.moveTo(0, h * 0.2); ctx.quadraticCurveTo(-w*0.3, h*0.4, -w*0.4, h*0.5);
                    ctx.moveTo(0, h * 0.4); ctx.quadraticCurveTo(w*0.2, h*0.6, w*0.2, h*0.7);
                    ctx.moveTo(0, h * 0.4); ctx.quadraticCurveTo(-w*0.2, h*0.6, -w*0.2, h*0.7);
                    ctx.stroke();

                    ctx.restore();
                }
            }

            // Filigrane, scharfe Staubgefäße
            let stamenCount = this.dna.stamens;
            for (let i = 0; i < stamenCount; i++) {
                let a = (Math.PI * 2 / stamenCount) * i + Math.random()*0.2;
                let d = size * 0.25;
                
                ctx.strokeStyle = 'rgba(255, 230, 150, 0.5)';
                ctx.lineWidth = 0.4;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d);
                ctx.stroke();

                ctx.fillStyle = '#ffda75';
                ctx.beginPath();
                ctx.arc(Math.cos(a) * d, Math.sin(a) * d, size * 0.04, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // Sammelt Blätter für den Schüttel-Effekt
        collectLeaves(arr) {
            if (this.hasBloom && this.bloomProgress > 0) {
                let count = this.isMain ? 10 : 4; // Mehr Blätter bei großen Blüten
                for(let i=0; i < count; i++) {
                    arr.push(new FallingPetal(
                        this.endX + (Math.random()-0.5)*15, 
                        this.endY + (Math.random()-0.5)*15, 
                        this.dna.color1, this.dna.color2, 
                        this.dna.bloomSize, this.dna.petalType
                    ));
                }
            }
            this.children.forEach(c => c.collectLeaves(arr));
        }
    }

    class PlantSystem {
        constructor(x, y) {
            // DNA generieren für absolutes Unikat
            let p = palettes[Math.floor(Math.random() * palettes.length)];
            this.dna = {
                palette: p, color1: p.c1, color2: p.c2,
                maxDepth: Math.floor(Math.random() * 2) + 4, // Viel mehr Tiefe und Äste!
                curviness: Math.random() * 0.8 + 0.3,
                bloomSize: Math.random() * 10 + 15, // Groß, aber durch kleine Nebenäste abwechslungsreich
                petalType: Math.floor(Math.random() * 3), 
                petalCount: Math.floor(Math.random() * 6) + 5, 
                petalWidth: Math.random() * 0.4 + 0.3,
                layers: Math.floor(Math.random() * 2) + 2, 
                stamens: Math.floor(Math.random() * 10) + 6 
            };

            let mainAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.4;
            // Der Hauptstamm (Basis). Zartere Startdicke (2.5 statt 3.5).
            this.root = new Branch(x, y, mainAngle, 70 + Math.random() * 30, 2.5, 0, this.dna, true);
        }
        update() { this.root.update(); }
        drawStems(ctx) { this.root.drawStems(ctx); }
        drawBlooms(ctx) { this.root.drawBlooms(ctx); }
        breakDown(arr) { this.root.collectLeaves(arr); }
    }

    function spawnStructure(x, y) {
        plants.push(new PlantSystem(x, y));
        if (plants.length > 8) plants.shift(); // Schützt das Handy vor Lag, da sie nun viel komplexer sind
    }

    function triggerShake() {
        if(plants.length === 0) return;
        plants.forEach(p => p.breakDown(fallingObjects));
        plants = []; 
    }

    // --- INTERAKTIONEN ---

    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        if (now - lastTap < 300) { triggerShake(); lastTap = 0; return; }
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnStructure(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('dblclick', triggerShake);

    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 25) triggerShake();
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }

    // --- ANIMATION ---

    function animate() {
        // Tiefer, reiner Hintergrund
        ctx.fillStyle = '#050406'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 1. Alle updaten
        plants.forEach(p => p.update());
        
        // 2. ERST alle Stängel zeichnen (Hintergrund)
        plants.forEach(p => p.drawStems(ctx));
        
        // 3. DANN alle Blüten zeichnen (Vordergrund, liegen perfekt auf)
        plants.forEach(p => p.drawBlooms(ctx));

        // 4. Fallende Blätter beim Schütteln
        for(let i = fallingObjects.length - 1; i >= 0; i--) {
            let obj = fallingObjects[i];
            obj.update();
            obj.draw(ctx);
            if (obj.y > canvas.height + 50) {
                fallingObjects.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
