<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - 3D Sculpted Art</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            /* Ein extrem dunkles, sattes Blau-Violett als edler Hintergrund */
            background: radial-gradient(circle at center, #1a1525 0%, #0a0810 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.25); letter-spacing: 6px; font-size: 12px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 4s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let fallingPetals = [];

    // Meisterklasse-Farbpaletten inspiriert von deinem Bild
    const palettes = [
        // Lotus aus deinem Bild (Pfirsich / Magenta / Tiefes Violett)
        { stem: '#2a1b38', shadow: '#310a31', mid: '#b83b70', highlight: '#ff9e7d', core: '#5c1049' },
        // Kühle Eleganz (Silberrosa / Deep Pink / Marineblau)
        { stem: '#161a29', shadow: '#25163b', mid: '#d13872', highlight: '#fbc5d6', core: '#3a0c3a' },
        // Warmer Sonnenuntergang (Weinrot / Lachs / Goldrosa)
        { stem: '#2b1a1c', shadow: '#420b23', mid: '#e35d6a', highlight: '#ffcba4', core: '#2b0413' }
    ];

    // --- FALLENDE BLÄTTER (Mit 3D-Drehung) ---
    class FallingPetal {
        constructor(x, y, palette, size) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 1) * 3 - 1;
            this.gravity = 0.08 + Math.random() * 0.05;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.1;
            this.size = size * (0.4 + Math.random() * 0.3);
            this.palette = palette;
            // Faktor für 3D-Flip-Effekt im Fall
            this.flip = Math.random() * Math.PI; 
            this.flipSpeed = 0.05 + Math.random() * 0.05;
        }
        update() {
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.rotSpeed;
            this.flip += this.flipSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.scale(Math.sin(this.flip), 1); // Erzeugt eine optische 3D-Drehung
            
            let grad = ctx.createLinearGradient(0, 0, 0, this.size);
            grad.addColorStop(0, this.palette.highlight);
            grad.addColorStop(1, this.palette.shadow);
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(this.size*0.4, this.size*0.3, this.size*0.3, this.size*0.8, 0, this.size);
            ctx.bezierCurveTo(-this.size*0.3, this.size*0.8, -this.size*0.4, this.size*0.3, 0, 0);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- DIE 3D BLÜTE ---
    class SculptedBloom {
        constructor(x, y, angle, size, palette) {
            this.x = x; this.y = y;
            this.baseAngle = angle;
            this.targetSize = size;
            this.palette = palette;
            this.progress = 0;
            this.petals = [];
            this.generatePetals();
        }

        generatePetals() {
            let layers = 4;
            let totalPetals = 0;
            
            // Schichten von außen nach innen aufbauen
            for (let l = layers; l > 0; l--) {
                let pCount = 5 + l * 2; // Außen mehr Blätter, innen weniger
                let layerSize = this.targetSize * (l / layers);
                let offsetAngle = (Math.PI * 2 / pCount) * 0.5 * (l % 2); // Versatz der Schichten

                for (let i = 0; i < pCount; i++) {
                    let angle = (Math.PI * 2 / pCount) * i + offsetAngle + this.baseAngle;
                    this.petals.push({
                        angle: angle + (Math.random()-0.5)*0.2, // Leichte organische Unregelmäßigkeit
                        size: layerSize * (0.8 + Math.random()*0.2),
                        widthMod: 0.35 + Math.random()*0.15,
                        delay: 1 - (l / layers) // Außen öffnet zuerst
                    });
                }
            }
        }

        update() {
            if (this.progress < 1) {
                // Ease-Out-Kurve für geschmeidiges Öffnen
                this.progress += 0.012; 
                if (this.progress > 1) this.progress = 1;
            }
        }

        draw(ctx) {
            if (this.progress === 0) return;

            ctx.save();
            ctx.translate(this.x, this.y);

            // Sanftes Skalieren beim Aufblühen
            let bloomScale = Math.sin(this.progress * Math.PI / 2);
            ctx.scale(bloomScale, bloomScale);

            // Echte Schlagschatten für die Blütenblätter
            ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 4;

            this.petals.forEach(p => {
                let pGrowth = Math.max(0, Math.min(1, (this.progress - p.delay * 0.4) * 2));
                if (pGrowth <= 0) return;
                
                let currentSize = p.size * Math.pow(pGrowth, 0.8);
                
                ctx.save();
                ctx.rotate(p.angle);
                
                let w = currentSize * p.widthMod;
                let h = currentSize;

                // --- 3D KNICK-TECHNIK (Das Geheimnis für den Realismus) ---
                
                // Rechte Blatthälfte (Liegt im Licht)
                let gradRight = ctx.createLinearGradient(0, 0, w, h);
                gradRight.addColorStop(0, this.palette.core);
                gradRight.addColorStop(0.3, this.palette.mid);
                gradRight.addColorStop(1, this.palette.highlight);
                
                ctx.fillStyle = gradRight;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                // Geschwungene Außenkante
                ctx.bezierCurveTo(w * 1.2, h * 0.3, w * 0.8, h * 0.8, 0, h);
                // Mittellinie (Knick)
                ctx.lineTo(0, 0); 
                ctx.fill();

                // Linke Blatthälfte (Liegt im Eigenschatten)
                let gradLeft = ctx.createLinearGradient(0, 0, -w, h);
                gradLeft.addColorStop(0, this.palette.core);
                gradLeft.addColorStop(0.5, this.palette.shadow);
                gradLeft.addColorStop(1, this.palette.mid);

                ctx.fillStyle = gradLeft;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                // Geschwungene Außenkante
                ctx.bezierCurveTo(-w * 1.2, h * 0.3, -w * 0.8, h * 0.8, 0, h);
                // Mittellinie (Knick)
                ctx.lineTo(0, 0); 
                ctx.fill();

                ctx.restore();
            });

            // Schatten für das Zentrum deaktivieren
            ctx.shadowColor = 'transparent';

            // Das detaillierte Zentrum (Staubgefäße) wie auf deinem Bild
            if (this.progress > 0.6) {
                let centerAlpha = (this.progress - 0.6) * 2.5;
                ctx.globalAlpha = centerAlpha;
                
                for(let i = 0; i < 20; i++) {
                    let a = Math.random() * Math.PI * 2;
                    let d = Math.random() * (this.targetSize * 0.2);
                    
                    // Feine Stiele
                    ctx.strokeStyle = this.palette.mid;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d);
                    ctx.stroke();
                    
                    // Leuchtende Pollenkappen
                    ctx.fillStyle = this.palette.highlight;
                    ctx.beginPath();
                    ctx.arc(Math.cos(a) * d, Math.sin(a) * d, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
        }
    }

    // --- DER ELEGANTE STAMM ---
    class MajesticPlant {
        constructor(x, y, palette) {
            this.startX = x; this.startY = y; 
            this.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.4; 
            this.length = 120 + Math.random() * 80;
            this.palette = palette;
            
            this.progress = 0; 
            this.speed = 0.01 + Math.random() * 0.005; // Sehr elegantes Wachstum
            
            this.curve = (Math.random() - 0.5) * 0.6; 
            this.endX = this.startX; 
            this.endY = this.startY;
            
            this.bloom = null;
            this.isFinished = false;
        }

        update() {
            if (this.progress < 1) {
                this.progress += this.speed;
                if (this.progress > 1) this.progress = 1;
            } 
            
            if (this.progress >= 1 && !this.isFinished) {
                this.isFinished = true;
                this.endX = this.startX + Math.cos(this.angle + this.curve) * this.length;
                this.endY = this.startY + Math.sin(this.angle + this.curve) * this.length;
                
                // Eine riesige, komplexe Hauptblüte pro Pflanze
                let bloomSize = 45 + Math.random() * 25; // Extrem groß für den Wow-Effekt
                this.bloom = new SculptedBloom(this.endX, this.endY, this.angle, bloomSize, this.palette);
            }

            if (this.bloom) this.bloom.update();
        }

        drawStem(ctx) {
            let curX = this.startX + Math.cos(this.angle + this.curve) * this.length * this.progress;
            let curY = this.startY + Math.sin(this.angle + this.curve) * this.length * this.progress;
            
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            let cpX = (this.startX + curX) / 2 + Math.sin(this.angle) * 25;
            let cpY = (this.startY + curY) / 2 + Math.cos(this.angle) * 25;
            ctx.quadraticCurveTo(cpX, cpY, curX, curY);

            // Stiel mit leichtem Farbverlauf
            let grad = ctx.createLinearGradient(this.startX, this.startY, curX, curY);
            grad.addColorStop(0, '#0a0810');
            grad.addColorStop(1, this.palette.stem);
            
            ctx.strokeStyle = grad;
            // Stamm wird nach oben hin dünner
            ctx.lineWidth = 4 * (1 - this.progress) + 1; 
            ctx.stroke();
        }

        drawBloom(ctx) {
            if (this.bloom) this.bloom.draw(ctx);
        }

        shatter(arr) {
            if (this.bloom && this.bloom.progress > 0.5) {
                let petalCount = this.bloom.petals.length;
                for(let i=0; i < petalCount; i++) {
                    arr.push(new FallingPetal(
                        this.bloom.x + (Math.random()-0.5)*30, 
                        this.bloom.y + (Math.random()-0.5)*30, 
                        this.palette, 
                        this.bloom.targetSize
                    ));
                }
            }
        }
    }

    function spawnPlant(x, y) {
        let p = palettes[Math.floor(Math.random() * palettes.length)];
        plants.push(new MajesticPlant(x, y, p));
        // Halte die Anzahl gering, da diese 3D-Schatten viel Rechenleistung brauchen!
        if (plants.length > 5) plants.shift(); 
    }

    function triggerShake() {
        if(plants.length === 0) return;
        plants.forEach(p => p.shatter(fallingPetals));
        plants = []; 
    }

    // --- EINGABEN ---
    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        if (now - lastTap < 300) { triggerShake(); lastTap = 0; return; }
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnPlant(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('dblclick', triggerShake);

    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 20) triggerShake();
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }

    // --- RENDER LOOP ---
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); // Komplett leeren für saubere Schatten

        plants.forEach(p => p.update());
        
        // 1. Zuerst alle Stämme zeichnen
        plants.forEach(p => p.drawStem(ctx));
        
        // 2. Dann die großen 3D-Blüten
        plants.forEach(p => p.drawBloom(ctx));

        // 3. Fallende Blätter beim Schütteln
        for(let i = fallingPetals.length - 1; i >= 0; i--) {
            let obj = fallingPetals[i];
            obj.update();
            obj.draw(ctx);
            if (obj.y > canvas.height + 100) {
                fallingPetals.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
