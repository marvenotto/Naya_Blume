<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Organic Botany</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(circle at 50% 100%, #17121c 0%, #050406 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.25); letter-spacing: 6px; font-size: 11px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let windParticles = [];

    // Edle Paletten: Holzige Stämme, lebhafte Blüten
    const palettes = [
        { bark: '#1a1818', highlight: '#3a3333', b1: '#fff0f5', b2: '#ff9e7d', b3: '#c71585', stamen: '#ffda75' }, 
        { bark: '#1c161a', highlight: '#3d2b33', b1: '#ffe4e1', b2: '#ff69b4', b3: '#8a2354', stamen: '#ffd700' },
        { bark: '#141716', highlight: '#2a3b31', b1: '#f8f8ff', b2: '#fbc5d6', b3: '#9c2a6b', stamen: '#fff5cc' }
    ];

    // --- FREI FALLENDE BLÜTENBLÄTTER ---
    class WindPetal {
        constructor(x, y, color1, color2, size) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = Math.random() * 1.5 + 0.5;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.05;
            this.flip = Math.random() * Math.PI;
            this.flipSpeed = 0.02 + Math.random() * 0.04;
            this.size = size * (0.4 + Math.random() * 0.4);
            this.c1 = color1; this.c2 = color2;
        }
        update() {
            this.x += this.vx + Math.sin(this.y * 0.01) * 0.5; // Sanfter Wind
            this.y += this.vy;
            this.rotation += this.rotSpeed;
            this.flip += this.flipSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.scale(Math.sin(this.flip), 1);
            let grad = ctx.createLinearGradient(0, 0, 0, this.size);
            grad.addColorStop(0, this.c1); grad.addColorStop(1, this.c2);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.bezierCurveTo(this.size*0.6, this.size*0.3, this.size*0.4, this.size*0.9, 0, this.size);
            ctx.bezierCurveTo(-this.size*0.4, this.size*0.9, -this.size*0.6, this.size*0.3, 0, 0);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- DIE VIELEN KLEINEN BLÜTEN ---
    class ClusterBloom {
        constructor(x, y, angle, maxSize, palette, delay) {
            this.x = x; this.y = y; this.angle = angle;
            this.maxSize = maxSize * (0.6 + Math.random() * 0.6); // Variierende Größen
            this.palette = palette;
            this.delay = delay; // Wann die Blüte anfängt sich zu öffnen
            this.progress = 0;
            
            // Zufällige Blütenform generieren (3-5 Schichten, 4-7 Blätter)
            this.layers = 2 + Math.floor(Math.random() * 3);
            this.petalCount = 4 + Math.floor(Math.random() * 4);
            this.petalWidth = 0.4 + Math.random() * 0.4; // Schmal bis breit
            this.isStar = Math.random() > 0.5; // Sternförmig oder rund?
        }

        update(globalProgress) {
            if (globalProgress > this.delay) {
                if (this.progress < 1) {
                    this.progress += 0.02; // Aufblüh-Geschwindigkeit
                    if (this.progress > 1) this.progress = 1;
                }
            }
        }

        draw(ctx) {
            if (this.progress <= 0) return;

            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            // Organisches Federn beim Aufgehen
            let scale = Math.sin(this.progress * Math.PI / 2) * (1 + 0.1 * Math.sin(this.progress * Math.PI));
            ctx.scale(scale, scale);

            for (let l = this.layers; l > 0; l--) {
                let layerSize = this.maxSize * (l / this.layers);
                let pCount = this.petalCount + (l === this.layers ? 1 : 0);
                
                let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, layerSize);
                let colorOuter = l % 2 === 0 ? this.palette.b3 : this.palette.b2;
                let colorInner = this.palette.b1;
                grad.addColorStop(0, colorInner);
                grad.addColorStop(1, colorOuter);
                
                ctx.fillStyle = grad;
                ctx.globalAlpha = 0.9;
                
                let offset = (Math.PI * 2 / pCount) * 0.5 * l;
                for (let i = 0; i < pCount; i++) {
                    ctx.save();
                    ctx.rotate((Math.PI * 2 / pCount) * i + offset);
                    
                    let w = layerSize * this.petalWidth;
                    let s = layerSize;
                    
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    if (this.isStar) {
                        ctx.quadraticCurveTo(w, s*0.4, 0, s);
                        ctx.quadraticCurveTo(-w, s*0.4, 0, 0);
                    } else {
                        ctx.bezierCurveTo(w*1.2, s*0.3, w*0.8, s*0.9, 0, s);
                        ctx.bezierCurveTo(-w*0.8, s*0.9, -w*1.2, s*0.3, 0, 0);
                    }
                    ctx.fill();
                    
                    // Zarte Details (Blattadern)
                    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                    ctx.lineWidth = 0.4;
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // Staubgefäße
            if (this.progress > 0.5) {
                ctx.globalAlpha = (this.progress - 0.5) * 2;
                for(let i=0; i<8; i++) {
                    let a = Math.random() * Math.PI*2;
                    let d = Math.random() * (this.maxSize * 0.3);
                    ctx.strokeStyle = this.palette.b2; ctx.lineWidth = 0.5;
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*d, Math.sin(a)*d); ctx.stroke();
                    ctx.fillStyle = this.palette.stamen;
                    ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, 1, 0, Math.PI*2); ctx.fill();
                }
            }
            ctx.restore();
        }
    }

    // --- DER ORGANISCHE, KOMPLEXE BAUM ---
    class OrganicTree {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.palette = palettes[Math.floor(Math.random() * palettes.length)];
            
            this.segments = []; // Alle Ast-Segmente
            this.blooms = [];   // Alle Blüten
            this.globalProgress = 0; 
            
            // Generiere die komplette Baumstruktur sofort im Speicher
            let baseAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.2;
            let baseWidth = 14 + Math.random() * 6; // Dicker Stamm
            this.generateBranch(this.x, this.y, baseAngle, baseWidth, 120, 0, 6); // Max Tiefe = 6 (sehr komplex!)
        }

        // Rekursive Funktion zur Erstellung des Baumes
        generateBranch(startX, startY, angle, width, length, depth, maxDepth) {
            let steps = 10; // Unterteilt jeden Ast in kleine organische Segmente
            let stepLen = length / steps;
            let currentX = startX;
            let currentY = startY;
            let currentAngle = angle;
            let currentWidth = width;
            
            let segmentStartDelay = depth * 0.12; // Äste wachsen nacheinander

            for (let i = 0; i < steps; i++) {
                // Organisches "Zittern" und Biegen (Random Walk)
                currentAngle += (Math.random() - 0.5) * 0.15;
                // Leichter Zug nach unten für hängende Äste (wie Trauerweide/Kirschbaum), wenn Tiefe hoch
                if (depth > 2) currentAngle += 0.02 * Math.cos(currentAngle); 

                let nextX = currentX + Math.cos(currentAngle) * stepLen;
                let nextY = currentY + Math.sin(currentAngle) * stepLen;
                
                // Segment speichern
                this.segments.push({
                    x1: currentX, y1: currentY, x2: nextX, y2: nextY,
                    w: currentWidth, 
                    delay: segmentStartDelay + (i/steps) * 0.1 // Berechnet, wann es gezeichnet wird
                });

                // --- BLÜTEN SPAWNEN ---
                // 1. Seitliche Blüten und Knospen direkt am Ast (Häufiger bei dünnen Ästen)
                if (depth >= 2 && Math.random() < 0.15) {
                    let bloomAngle = currentAngle + (Math.random() > 0.5 ? 1 : -1) * (1 + Math.random());
                    let bSize = 8 + Math.random() * 8; // Kleine Knospen/Blüten
                    this.blooms.push(new ClusterBloom(nextX, nextY, bloomAngle, bSize, this.palette, segmentStartDelay + (i/steps)*0.1 + 0.1));
                }

                currentX = nextX;
                currentY = nextY;
                currentWidth *= 0.92; // Ast wird dünner
            }

            // --- VERZWEIGUNGEN AM ENDE DES ASTES ---
            if (depth < maxDepth) {
                // 2 bis 3 neue Äste
                let branches = Math.random() > 0.3 ? 2 : 3;
                // Bei ganz dünnen Ästen manchmal aufhören
                if (depth > 4 && Math.random() > 0.6) branches = 0;

                for (let b = 0; b < branches; b++) {
                    let newAngle = currentAngle + (Math.random() - 0.5) * 1.2;
                    let newLength = length * (0.6 + Math.random() * 0.3);
                    let newWidth = currentWidth * (0.6 + Math.random() * 0.2);
                    this.generateBranch(currentX, currentY, newAngle, newWidth, newLength, depth + 1, maxDepth);
                }
            }
            
            // --- END-BLÜTEN (Cluster an den Astspitzen) ---
            if (depth >= 3) {
                // 1 dicke Hauptblüte am Ende
                this.blooms.push(new ClusterBloom(currentX, currentY, currentAngle, 15 + Math.random() * 12, this.palette, segmentStartDelay + 0.1));
                // 1-2 kleine Nebenblüten
                if (Math.random() > 0.4) {
                    this.blooms.push(new ClusterBloom(currentX + (Math.random()-0.5)*10, currentY + (Math.random()-0.5)*10, currentAngle + 1, 8 + Math.random() * 5, this.palette, segmentStartDelay + 0.15));
                }
            }
        }

        update() {
            if (this.globalProgress < 2.5) { // Läuft länger, da Struktur komplexer
                this.globalProgress += 0.006; 
            }
            this.blooms.forEach(b => b.update(this.globalProgress));

            // Zufälliger Blütenregen, wenn Baum ausgewachsen
            if (this.globalProgress > 1.5 && Math.random() < 0.02) {
                // Sucht sich eine zufällige Blüte
                let b = this.blooms[Math.floor(Math.random() * this.blooms.length)];
                if (b.progress > 0.8) {
                    windParticles.push(new WindPetal(b.x, b.y, this.palette.b1, this.palette.b2, b.maxSize));
                }
            }
        }

        drawStems(ctx) {
            ctx.lineCap = 'round';
            this.segments.forEach(seg => {
                if (this.globalProgress > seg.delay) {
                    // Wie weit ist dieses spezifische Segment gezeichnet?
                    let segProgress = Math.min(1, (this.globalProgress - seg.delay) * 20);
                    
                    let drawX = seg.x1 + (seg.x2 - seg.x1) * segProgress;
                    let drawY = seg.y1 + (seg.y2 - seg.y1) * segProgress;

                    // Schatten/Rinden-Farbe (dick)
                    ctx.beginPath();
                    ctx.moveTo(seg.x1, seg.y1);
                    ctx.lineTo(drawX, drawY);
                    ctx.strokeStyle = this.palette.bark;
                    ctx.lineWidth = seg.w;
                    ctx.stroke();

                    // Licht-Kante für Plastizität (dünn, leicht versetzt)
                    ctx.beginPath();
                    ctx.moveTo(seg.x1 - seg.w*0.1, seg.y1 - seg.w*0.1);
                    ctx.lineTo(drawX - seg.w*0.1, drawY - seg.w*0.1);
                    ctx.strokeStyle = this.palette.highlight;
                    ctx.lineWidth = seg.w * 0.3;
                    ctx.stroke();
                }
            });
        }

        drawBlooms(ctx) {
            // Um Fehler zu vermeiden, erst sortieren, dass kleine hinten und große vorne sind (Tiefeneffekt)
            // this.blooms.sort((a, b) => a.maxSize - b.maxSize);
            this.blooms.forEach(b => b.draw(ctx));
        }
    }

    function spawnPlant(x, y) {
        plants.push(new OrganicTree(x, y));
        // Max 2 Pflanzen gleichzeitig, da hier tausende Berechnungen passieren!
        if (plants.length > 2) plants.shift(); 
    }

    function triggerWind() {
        plants.forEach(p => {
            if (p.globalProgress > 0.5) {
                p.blooms.forEach(b => {
                    if (Math.random() > 0.7) { // 30% der Blüten werfen Blätter ab
                        windParticles.push(new WindPetal(b.x, b.y, p.palette.b1, p.palette.b2, b.maxSize));
                    }
                });
            }
        });
    }

    // --- EINGABEN ---
    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        if (now - lastTap < 300) { triggerWind(); lastTap = 0; return; }
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnPlant(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('dblclick', triggerWind);

    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 15) triggerWind();
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }

    // --- ANIMATION LOOP ---
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        plants.forEach(p => p.update());
        
        // 1. Alle Stämme zeichnen
        plants.forEach(p => p.drawStems(ctx));
        
        // 2. Alle Blüten zeichnen
        plants.forEach(p => p.drawBlooms(ctx));

        // 3. Fallende Blütenblätter (Windeffekt)
        for(let i = windParticles.length - 1; i >= 0; i--) {
            let wp = windParticles[i];
            wp.update();
            wp.draw(ctx);
            if (wp.y > canvas.height + 50) windParticles.splice(i, 1);
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
