<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Majestic Flora</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(circle at center, #101211 0%, #030403 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.35); letter-spacing: 7px; font-size: 11px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let windPetals = [];

    // --- 1. HOCHLEISTUNGS-CACHING DER BLÜTEN ---
    const flowerCache = [];
    const petalCache = [];
    const CACHE_SIZE = 20; // Noch mehr Vielfalt

    function preRenderGraphics() {
        // Die schönsten, elegantesten Rosa- und Magentatöne
        const baseHues = [335, 315, 345, 325]; 

        for(let i=0; i<CACHE_SIZE; i++) {
            let offCanvas = document.createElement('canvas');
            let size = 180; // Sehr hohe Auflösung für scharfe Details
            offCanvas.width = size; offCanvas.height = size;
            let oCtx = offCanvas.getContext('2d');
            let center = size / 2;

            let hue = baseHues[Math.floor(Math.random() * baseHues.length)] + (Math.random()-0.5)*25;
            let layers = 2 + Math.floor(Math.random() * 3); // 2-4 Schichten
            let petalsPerLayer = 5 + Math.floor(Math.random() * 4); // 5-8 Blätter

            // Blütenblätter zeichnen
            for (let l = layers; l > 0; l--) {
                let layerRadius = (size/2) * (l/layers) * 0.95;
                
                let grad = oCtx.createRadialGradient(center, center, 0, center, center, layerRadius);
                grad.addColorStop(0, `hsla(${hue}, 95%, 85%, 0.95)`);
                grad.addColorStop(1, `hsla(${hue}, 80%, 45%, 0.85)`);
                oCtx.fillStyle = grad;
                
                let offset = (Math.PI * 2 / petalsPerLayer) * 0.5 * l;
                for (let p = 0; p < petalsPerLayer; p++) {
                    oCtx.save();
                    oCtx.translate(center, center);
                    oCtx.rotate((Math.PI * 2 / petalsPerLayer) * p + offset);
                    
                    let w = layerRadius * (0.4 + Math.random()*0.3); // Etwas breiter und prächtiger
                    
                    oCtx.beginPath();
                    oCtx.moveTo(0,0);
                    oCtx.bezierCurveTo(w, layerRadius*0.3, w*0.9, layerRadius*0.9, 0, layerRadius);
                    oCtx.bezierCurveTo(-w*0.9, layerRadius*0.9, -w, layerRadius*0.3, 0, 0);
                    oCtx.fill();
                    
                    // Elegante, weiße Seidenkante
                    oCtx.strokeStyle = `hsla(${hue}, 20%, 100%, 0.6)`;
                    oCtx.lineWidth = 1.2;
                    oCtx.stroke();

                    // Filigrane Blattadern
                    oCtx.strokeStyle = `hsla(${hue}, 20%, 100%, 0.3)`;
                    oCtx.lineWidth = 0.5;
                    oCtx.beginPath(); oCtx.moveTo(0,0); oCtx.lineTo(0, layerRadius*0.6); oCtx.stroke();
                    oCtx.restore();
                }
            }

            // Dichtes, goldenes Zentrum
            for(let s=0; s<18; s++) {
                let a = Math.random() * Math.PI*2;
                let d = Math.random() * (size * 0.15);
                oCtx.strokeStyle = `hsla(${hue}, 80%, 30%, 0.7)`;
                oCtx.lineWidth = 1;
                oCtx.beginPath(); oCtx.moveTo(center, center); oCtx.lineTo(center + Math.cos(a)*d, center + Math.sin(a)*d); oCtx.stroke();
                
                oCtx.fillStyle = '#ffdf70';
                oCtx.beginPath(); oCtx.arc(center + Math.cos(a)*d, center + Math.sin(a)*d, 2.5, 0, Math.PI*2); oCtx.fill();
            }
            flowerCache.push(offCanvas);

            // Textur für fallende Blütenblätter
            let pCanvas = document.createElement('canvas');
            pCanvas.width = 50; pCanvas.height = 50;
            let pCtx = pCanvas.getContext('2d');
            let pGrad = pCtx.createLinearGradient(0,0, 0,50);
            pGrad.addColorStop(0, `hsla(${hue}, 90%, 80%, 0.95)`);
            pGrad.addColorStop(1, `hsla(${hue}, 80%, 45%, 0.8)`);
            pCtx.fillStyle = pGrad;
            pCtx.beginPath(); pCtx.moveTo(25,0);
            pCtx.bezierCurveTo(50, 15, 35, 50, 25, 50);
            pCtx.bezierCurveTo(15, 50, 0, 15, 25, 0); pCtx.fill();
            petalCache.push(pCanvas);
        }
    }
    preRenderGraphics();

    // --- 2. FALLENDE BLÄTTER ---
    class WindPetal {
        constructor(x, y, textureId) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 1) * 3 - 1;
            this.gravity = 0.1 + Math.random() * 0.1;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.12;
            this.scale = 0.25 + Math.random() * 0.25; // Unterschiedlich große fallende Blätter
            this.texture = petalCache[textureId];
            this.flip = Math.random() * Math.PI;
            this.flipSpeed = 0.03 + Math.random() * 0.05;
        }
        update() {
            this.vy += this.gravity;
            this.x += this.vx; this.y += this.vy;
            this.rotation += this.rotSpeed;
            this.flip += this.flipSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.scale(Math.sin(this.flip) * this.scale, this.scale);
            ctx.drawImage(this.texture, -25, -25);
            ctx.restore();
        }
    }

    // --- 3. DIE BLÜTEN ---
    class CachedBloom {
        constructor(x, y, angle, size) {
            this.x = x; this.y = y; this.angle = angle;
            this.targetSize = size * (0.5 + Math.random()*0.5);
            this.textureId = Math.floor(Math.random() * CACHE_SIZE);
            this.texture = flowerCache[this.textureId];
            this.progress = 0;
            this.delay = Math.random() * 0.4;
        }
        update(globalProgress) {
            if (globalProgress > this.delay && this.progress < 1) {
                this.progress += 0.03; 
                if (this.progress > 1) this.progress = 1;
            }
        }
        draw(ctx) {
            if (this.progress <= 0) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            
            let bounce = Math.sin(this.progress * Math.PI / 2) * (1 + 0.1 * Math.sin(this.progress * Math.PI));
            let finalScale = (this.targetSize / 180) * bounce; 
            
            ctx.scale(finalScale, finalScale);
            ctx.drawImage(this.texture, -90, -90); 
            ctx.restore();
        }
    }

    // --- 4. ÄSTHETISCHER, PRUNKVALLER BAUM ---
    class GrandTree {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.branches = []; 
            this.blooms = [];   
            this.globalProgress = 0; 
            
            // Natürliche Holzfarben
            this.colorDark = '#1a1412';  // Tiefes, fast schwarzes Braun
            this.colorMid = '#3b2a25';   // Mittleres Rindenbraun
            this.colorLight = '#87695c'; // Feine, scharfe Lichtkante
            
            let baseAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.15;
            
            // Erstellt eine gewaltige, ausladende Struktur
            this.generateBranch(this.x, this.y, baseAngle, 110 + Math.random()*40, 20, 0, 4);
            
            this.blooms.sort((a, b) => a.targetSize - b.targetSize);
        }

        generateBranch(startX, startY, angle, length, width, depth, maxDepth) {
            let endX = startX + Math.cos(angle) * length;
            let endY = startY + Math.sin(angle) * length;
            let delay = depth * 0.12; 
            
            // Organischer Ast-Bogen
            let cpX = (startX + endX)/2 + (Math.random()-0.5)*(length*0.6);
            let cpY = (startY + endY)/2 + (Math.random()-0.5)*(length*0.6);
            
            this.branches.push({
                x1: startX, y1: startY, cpX: cpX, cpY: cpY, x2: endX, y2: endY,
                w: width, delay: delay
            });

            if (depth < maxDepth) {
                // EXTREM GEFÄCHERT: Der Baum teilt sich stark auf (bis zu 4 Äste pro Knoten)
                let numBranches = depth === 0 ? 3 : (2 + Math.floor(Math.random() * 2));
                
                for (let i = 0; i < numBranches; i++) {
                    // Breiterer Winkel für das "prunkvolle, ausladende" Gefühl
                    let newAngle = angle + (Math.random() - 0.5) * 1.8;
                    let newLen = length * (0.6 + Math.random() * 0.25);
                    let newWidth = width * 0.6; // Verjüngt sich organisch
                    this.generateBranch(endX, endY, newAngle, newLen, newWidth, depth + 1, maxDepth);
                }
                
                // Sehr viele kleine Blüten/Knospen entlang der dicken Äste
                if (depth > 0) {
                    let sideBlooms = 2 + Math.floor(Math.random()*4);
                    for(let k=0; k<sideBlooms; k++) {
                        // Position zufällig auf dem Ast
                        let t = Math.random();
                        let px = Math.pow(1-t,2)*startX + 2*(1-t)*t*cpX + Math.pow(t,2)*endX;
                        let py = Math.pow(1-t,2)*startY + 2*(1-t)*t*cpY + Math.pow(t,2)*endY;
                        this.blooms.push(new CachedBloom(px, py, angle + (Math.random()-0.5)*3, 15 + Math.random()*15));
                    }
                }

            } else {
                // MASSIVES BLÜTEN-CLUSTER am Ende der Äste (Prunkvoll!)
                let numBlooms = 5 + Math.floor(Math.random()*5); // 5 bis 9 Blüten pro Spitze!
                for(let b = 0; b < numBlooms; b++) {
                    let bAngle = angle + (Math.random()-0.5)*3;
                    let offsetX = endX + (Math.random()-0.5)*30;
                    let offsetY = endY + (Math.random()-0.5)*30;
                    let size = 25 + Math.random()*30; // Riesige Hauptblüten
                    this.blooms.push(new CachedBloom(offsetX, offsetY, bAngle, size));
                }
            }
        }

        update() {
            if (this.globalProgress < 1.5) { this.globalProgress += 0.015; } 
            this.blooms.forEach(b => b.update(this.globalProgress - 0.4)); 
        }

        drawStems(ctx) {
            ctx.lineCap = 'round';
            this.branches.forEach(b => {
                if (this.globalProgress > b.delay) {
                    let p = Math.min(1, (this.globalProgress - b.delay) * 4); 
                    
                    let curX = Math.pow(1-p, 2)*b.x1 + 2*(1-p)*p*b.cpX + Math.pow(p,2)*b.x2;
                    let curY = Math.pow(1-p, 2)*b.y1 + 2*(1-p)*p*b.cpY + Math.pow(p,2)*b.y2;
                    let curCpX = (b.x1 + curX)/2;
                    let curCpY = (b.y1 + curY)/2;

                    // 1. Dunkle Basis (Der Schatten des Astes)
                    ctx.beginPath();
                    ctx.moveTo(b.x1, b.y1);
                    ctx.quadraticCurveTo(curCpX, curCpY, curX, curY);
                    ctx.strokeStyle = this.colorDark;
                    ctx.lineWidth = b.w;
                    ctx.stroke();

                    // 2. Mittlere Holztextur (Macht den Ast organisch)
                    ctx.beginPath();
                    ctx.moveTo(b.x1, b.y1);
                    ctx.quadraticCurveTo(curCpX, curCpY, curX, curY);
                    ctx.strokeStyle = this.colorMid;
                    ctx.lineWidth = b.w * 0.6;
                    ctx.stroke();

                    // 3. Scharfe, dünne Lichtkante (Kein künstliches Leuchten mehr, sondern wie von der Sonne beschienen)
                    ctx.save();
                    // Verschiebt die Kante leicht nach oben links
                    ctx.translate(-b.w*0.15, -b.w*0.15); 
                    ctx.beginPath();
                    ctx.moveTo(b.x1, b.y1);
                    ctx.quadraticCurveTo(curCpX, curCpY, curX, curY);
                    ctx.strokeStyle = this.colorLight;
                    ctx.lineWidth = Math.max(0.5, b.w * 0.15); // Sehr feiner Strich
                    ctx.stroke();
                    ctx.restore();
                }
            });
        }

        drawBlooms(ctx) {
            this.blooms.forEach(b => b.draw(ctx));
        }

        shatter(arr) {
            this.blooms.forEach(b => {
                if (b.progress > 0.5) {
                    // Gewaltiger Blütenregen
                    let count = 3 + Math.floor(Math.random()*4);
                    for(let i=0; i<count; i++) {
                        arr.push(new WindPetal(b.x, b.y, b.textureId));
                    }
                }
            });
        }
    }

    function spawnPlant(x, y) {
        plants.push(new GrandTree(x, y));
        // Durch das Caching laufen auch 10 dieser riesigen Bäume komplett flüssig
        if (plants.length > 10) plants.shift(); 
    }

    function triggerClear() {
        if(plants.length === 0) return;
        plants.forEach(p => p.shatter(windPetals));
        plants = []; 
    }

    // --- 5. EINGABEN ---
    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        if (now - lastTap < 100) return; 
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnPlant(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('touchstart', handleTouch, {passive: true});

    // --- 6. SCHÜTTEL-ERKENNUNG ---
    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 25) {
                triggerClear();
            }
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }
    
    window.addEventListener('dblclick', triggerClear);

    // --- 7. FLÜSSIGER RENDER LOOP ---
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        plants.forEach(p => p.update());
        
        // Erst Stämme, dann Blüten
        plants.forEach(p => p.drawStems(ctx));
        plants.forEach(p => p.drawBlooms(ctx));

        // Schüttel-Effekt
        for(let i = windPetals.length - 1; i >= 0; i--) {
            let wp = windPetals[i];
            wp.update();
            wp.draw(ctx);
            if (wp.y > canvas.height + 100) windPetals.splice(i, 1);
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
