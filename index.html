<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Marven</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(circle at center, #140d10 0%, #050304 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.5); letter-spacing: 7px; font-size: 11px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let windPetals = [];

    // --- 1. PROZEDURALES PRE-RENDERING ---
    const flowerCache = [];
    const petalCache = [];
    let leafTexture; 
    const CACHE_SIZE = 30; // Erhöht für extreme Vielfalt

    function preRenderGraphics() {
        // RENDERE DAS KLEINE BLATT (Intensiv Grün)
        let lCanvas = document.createElement('canvas');
        lCanvas.width = 40; lCanvas.height = 40;
        let lCtx = lCanvas.getContext('2d');
        lCtx.translate(20, 20); lCtx.rotate(Math.PI / 4);
        
        let lGrad = lCtx.createLinearGradient(-15, 0, 15, 0);
        lGrad.addColorStop(0, '#125923'); 
        lGrad.addColorStop(1, '#4bba60'); 
        lCtx.fillStyle = lGrad;
        lCtx.beginPath(); lCtx.moveTo(-15, 0);
        lCtx.quadraticCurveTo(0, -10, 15, 0); lCtx.quadraticCurveTo(0, 10, -15, 0); lCtx.fill();
        lCtx.strokeStyle = 'rgba(255, 255, 255, 0.25)'; lCtx.lineWidth = 1;
        lCtx.beginPath(); lCtx.moveTo(-12, 0); lCtx.lineTo(10, 0); lCtx.stroke();
        leafTexture = lCanvas;

        const warmHues = [335, 340, 345, 350, 355];

        for(let i=0; i<CACHE_SIZE; i++) {
            let offCanvas = document.createElement('canvas');
            let size = 220; // Höhere Auflösung für feine Details
            offCanvas.width = size; offCanvas.height = size;
            let oCtx = offCanvas.getContext('2d');
            let center = size / 2;
            oCtx.translate(center, center);

            let hue = warmHues[Math.floor(Math.random() * warmHues.length)] + (Math.random()-0.5)*5; 
            
            // PROZEDURALE PARAMETER FÜR ABSOLUTE UNIKATE
            let shapeType = Math.random(); // Fließender Übergang der Arten
            let layers = 3 + Math.floor(Math.random() * 4); // 3 bis 6 Schichten für extreme Tiefe
            let petalsPerLayer = 6 + Math.floor(Math.random() * 8); // 6 bis 13 Blätter
            
            // Kurven-Kontrollpunkte (Bestimmen die Form der Blütenblätter dynamisch)
            let petalWidthFactor = 0.15 + Math.random() * 0.25; 
            let petalSharpness = Math.random(); // 0 = weich, 1 = extrem spitz
            let jaggedEdges = Math.random() > 0.7; // Sollen die Spitzen leicht ausgefranst sein?

            for (let l = layers; l > 0; l--) {
                let r = (size*0.45) * (l/layers);
                
                // Tiefe Farben innen, helle leuchtende Farben außen
                let layerLightness = 50 + (l*6) + Math.random()*5;
                oCtx.fillStyle = `hsla(${hue}, 95%, ${layerLightness}%, 0.95)`;
                oCtx.strokeStyle = `hsla(${hue}, 100%, 85%, 0.8)`;
                oCtx.lineWidth = 0.5 + (l/layers)*0.5;
                
                let offset = (Math.PI*2/petalsPerLayer) * 0.5 * l;
                
                for (let p = 0; p < petalsPerLayer; p++) {
                    oCtx.save(); 
                    // Minimale zufällige Unordnung pro Blatt für organischen Look
                    oCtx.rotate((Math.PI*2/petalsPerLayer)*p + offset + (Math.random()-0.5)*0.1);
                    
                    let w = r * petalWidthFactor;
                    let tipW = jaggedEdges ? w * 0.2 : 0; // Gezackte oder glatte Spitze
                    
                    oCtx.beginPath(); 
                    oCtx.moveTo(0,0);
                    
                    if (shapeType < 0.33) {
                        // DIE DAHLIE (Spitz, geometrisch, viele Schichten)
                        oCtx.quadraticCurveTo(w, r*0.4, tipW, r);
                        if(jaggedEdges) oCtx.lineTo(-tipW, r*0.9); // Zacke
                        oCtx.quadraticCurveTo(-w, r*0.4, 0, 0);
                    } 
                    else if (shapeType < 0.66) {
                        // DIE LILIE (Lang, geschwungen, fließend)
                        let curve = r * 0.2 * petalSharpness;
                        oCtx.bezierCurveTo(w+curve, r*0.3, w, r*0.8, 0, r);
                        oCtx.bezierCurveTo(-w, r*0.8, -w-curve, r*0.3, 0, 0);
                    } 
                    else {
                        // DIE WILDE ROSE (Detailreich, leicht asymmetrisch)
                        let cpY = r * (0.5 + petalSharpness*0.3);
                        oCtx.bezierCurveTo(w*1.5, cpY, w*0.8, r, tipW, r);
                        if(jaggedEdges) {
                            oCtx.lineTo(0, r*0.95);
                            oCtx.lineTo(-tipW, r);
                        }
                        oCtx.bezierCurveTo(-w*0.8, r, -w*1.5, cpY, 0, 0);
                    }
                    
                    oCtx.fill(); oCtx.stroke(); 
                    
                    // Feine innere Blattadern für maximale Detailtiefe
                    oCtx.strokeStyle = `hsla(${hue}, 50%, 100%, 0.3)`;
                    oCtx.lineWidth = 0.5;
                    oCtx.beginPath(); oCtx.moveTo(0,0); oCtx.quadraticCurveTo(w*0.2, r*0.4, 0, r*0.7); oCtx.stroke();
                    
                    oCtx.restore();
                }
            }

            // Aufwendiges, tiefes Zentrum (Pistils & Stamens)
            let centerSize = size * 0.1;
            oCtx.fillStyle = `hsla(${hue}, 100%, 20%, 0.8)`; // Dunkler Kern
            oCtx.beginPath(); oCtx.arc(0, 0, centerSize*0.4, 0, Math.PI*2); oCtx.fill();
            
            for(let s=0; s<25; s++) {
                let a = Math.random() * Math.PI*2;
                let d = Math.random() * centerSize;
                oCtx.strokeStyle = `hsla(${hue}, 100%, 70%, 0.8)`;
                oCtx.lineWidth = 0.8;
                oCtx.beginPath(); oCtx.moveTo(0,0); oCtx.lineTo(Math.cos(a)*d, Math.sin(a)*d); oCtx.stroke();
                
                oCtx.fillStyle = '#ffce54'; // Goldene Pollen
                oCtx.beginPath(); oCtx.arc(Math.cos(a)*d, Math.sin(a)*d, 1.5 + Math.random(), 0, Math.PI*2); oCtx.fill();
            }
            flowerCache.push(offCanvas);

            // Passendes Blütenblatt für den Wind
            let pCanvas = document.createElement('canvas');
            pCanvas.width = 50; pCanvas.height = 50;
            let pCtx = pCanvas.getContext('2d');
            let pGrad = pCtx.createLinearGradient(0,0, 0,50);
            pGrad.addColorStop(0, `hsla(${hue}, 95%, 80%, 0.95)`);
            pGrad.addColorStop(1, `hsla(${hue}, 85%, 55%, 0.85)`);
            pCtx.fillStyle = pGrad;
            pCtx.beginPath(); pCtx.moveTo(25,0);
            pCtx.bezierCurveTo(45, 10, 35, 45, 25, 50);
            pCtx.bezierCurveTo(15, 45, 5, 10, 25, 0); pCtx.fill();
            petalCache.push(pCanvas);
        }
    }
    preRenderGraphics();

    // --- 2. FALLENDE BLÄTTER ---
    class WindPetal {
        constructor(x, y, textureId) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 1) * 3 - 1;
            this.gravity = 0.12;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.15;
            this.size = 0.35 + Math.random() * 0.35;
            this.texture = petalCache[textureId];
            this.flip = Math.random() * Math.PI;
            this.flipSpeed = 0.04 + Math.random() * 0.06;
        }
        update() {
            this.vy += this.gravity; this.x += this.vx; this.y += this.vy;
            this.rotation += this.rotSpeed; this.flip += this.flipSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.scale(Math.sin(this.flip) * this.size, this.size);
            ctx.drawImage(this.texture, -25, -25);
            ctx.restore();
        }
    }

    // --- 3. DIE BLÜTE (Dynamisch & Abwechslungsreich) ---
    class PlantBloom {
        constructor(x, y, angle, size) {
            this.x = x; this.y = y; 
            this.angle = angle + (Math.random()-0.5)*0.5; // Organische Drehung
            this.targetSize = size * (0.7 + Math.random()*0.4);
            
            // Jede Blüte wählt zufällig eine Textur, um Wiederholungen auszuschließen
            this.textureId = Math.floor(Math.random() * CACHE_SIZE);
            this.texture = flowerCache[this.textureId];
            this.progress = 0;
            this.delay = Math.random() * 0.35;
        }
        update(globalProgress) {
            if (globalProgress > this.delay && this.progress < 1) {
                this.progress += 0.035; 
                if (this.progress > 1) this.progress = 1;
            }
        }
        draw(ctx) {
            if (this.progress <= 0) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            
            let bounce = Math.sin(this.progress * Math.PI / 2) * (1 + 0.1 * Math.sin(this.progress * Math.PI));
            // 220 ist die neue Render-Auflösung
            let finalScale = (this.targetSize / 220) * bounce; 
            
            ctx.scale(finalScale, finalScale);
            ctx.drawImage(this.texture, -110, -110); 
            ctx.restore();
        }
    }

    // --- 4. DER FEINE, VERZWEIGTE BAUM ---
    class ComplexTree {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.branches = []; 
            this.blooms = [];   
            this.globalProgress = 0; 
            
            let baseWidth = 4 + Math.random() * 3; // Sehr feine Stämme (Dünn und intensiv)
            let baseAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.3;
            
            this.generateBranch(this.x, this.y, baseAngle, 85 + Math.random()*35, baseWidth, 0, 4);
            this.blooms.sort((a, b) => a.targetSize - b.targetSize);
        }

        generateBranch(startX, startY, angle, length, width, depth, maxDepth) {
            let segments = 5;
            let curX = startX; let curY = startY;
            let curAngle = angle;
            let delay = depth * 0.12;
            let branchPath = [{x: curX, y: curY}];
            let leafPositions = []; 

            for(let i=1; i<=segments; i++) {
                curAngle += (Math.random() - 0.5) * 0.5; 
                let segLen = length / segments;
                curX += Math.cos(curAngle) * segLen;
                curY += Math.sin(curAngle) * segLen;
                branchPath.push({x: curX, y: curY});

                if (Math.random() > 0.3) {
                    leafPositions.push({
                        x: curX, y: curY, 
                        angle: curAngle + (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random()*0.6),
                        size: 0.25 + Math.random()*0.3 
                    });
                }
            }

            this.branches.push({ path: branchPath, leaves: leafPositions, w: width, delay: delay });

            if (depth < maxDepth) {
                // Starke Auffächerung für Volumen
                let numBranches = depth === 0 ? 3 : (2 + Math.floor(Math.random() * 2));
                for (let i = 0; i < numBranches; i++) {
                    let newAngle = curAngle + (Math.random() - 0.5) * 1.8;
                    let newLen = length * (0.65 + Math.random() * 0.2);
                    let newWidth = width * 0.6; 
                    this.generateBranch(curX, curY, newAngle, newLen, newWidth, depth + 1, maxDepth);
                }
                
                // Viele kleine Nebenblüten
                if (depth > 0) {
                    let sideBlooms = 2 + Math.floor(Math.random()*4);
                    for(let k=0; k<sideBlooms; k++) {
                        let pt = branchPath[Math.floor(Math.random() * (branchPath.length-1)) + 1];
                        this.blooms.push(new PlantBloom(pt.x + (Math.random()-0.5)*15, pt.y + (Math.random()-0.5)*15, curAngle, 18 + Math.random()*12));
                    }
                }
            } else {
                // Üppige Cluster an den Spitzen
                let numBlooms = 4 + Math.floor(Math.random()*5); 
                for(let b = 0; b < numBlooms; b++) {
                    let bAngle = curAngle + (Math.random()-0.5)*3;
                    let offsetX = curX + (Math.random()-0.5)*25;
                    let offsetY = curY + (Math.random()-0.5)*25;
                    let size = 28 + Math.random()*25; 
                    this.blooms.push(new PlantBloom(offsetX, offsetY, bAngle, size));
                }
            }
        }

        update() {
            if (this.globalProgress < 1.5) { this.globalProgress += 0.015; } 
            this.blooms.forEach(b => b.update(this.globalProgress - 0.4)); 
        }

        drawStems(ctx) {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            this.branches.forEach(b => {
                if (this.globalProgress > b.delay) {
                    let p = Math.min(1, (this.globalProgress - b.delay) * 4); 
                    let pointsToDraw = Math.max(1, Math.floor(p * b.path.length));
                    
                    // 1. Tiefgrüner Schatten
                    ctx.beginPath();
                    ctx.moveTo(b.path[0].x, b.path[0].y);
                    for(let i=1; i<pointsToDraw; i++) ctx.lineTo(b.path[i].x, b.path[i].y);
                    ctx.strokeStyle = '#082b10'; 
                    ctx.lineWidth = b.w;
                    ctx.stroke();

                    // 2. Leuchtendes Mittelgrün
                    ctx.beginPath();
                    ctx.moveTo(b.path[0].x, b.path[0].y);
                    for(let i=1; i<pointsToDraw; i++) ctx.lineTo(b.path[i].x, b.path[i].y);
                    ctx.strokeStyle = '#176628'; 
                    ctx.lineWidth = b.w * 0.7;
                    ctx.stroke();

                    // 3. Filigrane Lichtkante
                    ctx.beginPath();
                    ctx.moveTo(b.path[0].x - b.w*0.2, b.path[0].y - b.w*0.2);
                    for(let i=1; i<pointsToDraw; i++) ctx.lineTo(b.path[i].x - b.w*0.2, b.path[i].y - b.w*0.2);
                    ctx.strokeStyle = '#4bba60'; 
                    ctx.lineWidth = Math.max(0.4, b.w * 0.4);
                    ctx.stroke();

                    // 4. Die grünen Blätter
                    b.leaves.forEach((leaf, index) => {
                        if (index < pointsToDraw - 1) { 
                            ctx.save();
                            ctx.translate(leaf.x, leaf.y);
                            ctx.rotate(leaf.angle);
                            ctx.scale(leaf.size * p, leaf.size * p); 
                            ctx.drawImage(leafTexture, -20, -20);
                            ctx.restore();
                        }
                    });
                }
            });
        }

        drawBlooms(ctx) {
            this.blooms.forEach(b => b.draw(ctx));
        }

        shatter(arr) {
            this.blooms.forEach(b => {
                if (b.progress > 0.5) {
                    let count = 2 + Math.floor(Math.random()*4);
                    for(let i=0; i<count; i++) arr.push(new WindPetal(b.x, b.y, b.textureId));
                }
            });
        }
    }

    function spawnPlant(x, y) {
        plants.push(new ComplexTree(x, y));
        if (plants.length > 15) plants.shift(); // Extrem flüssig, erlaubt 15 Pflanzen
    }

    function triggerClear() {
        if(plants.length === 0) return;
        plants.forEach(p => p.shatter(windPetals));
        plants = []; 
    }

    // --- 5. EINGABEN ---
    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        if (now - lastTap < 100) return; 
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnPlant(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('touchstart', handleTouch, {passive: true});

    // --- 6. SCHÜTTEL-ERKENNUNG ---
    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 25) {
                triggerClear();
            }
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }
    
    window.addEventListener('dblclick', triggerClear);

    // --- 7. FLÜSSIGER RENDER LOOP ---
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        plants.forEach(p => p.update());
        
        plants.forEach(p => p.drawStems(ctx));
        plants.forEach(p => p.drawBlooms(ctx));

        for(let i = windPetals.length - 1; i >= 0; i--) {
            let wp = windPetals[i];
            wp.update();
            wp.draw(ctx);
            if (wp.y > canvas.height + 100) windPetals.splice(i, 1);
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
