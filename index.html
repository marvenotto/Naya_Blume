<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Optimized Floral Art</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            /* Etwas wärmerer, edler Hintergrund, damit die Stiele besser wirken */
            background: radial-gradient(circle at 50% 50%, #1c1821 0%, #08070a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.4); letter-spacing: 6px; font-size: 11px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 4s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let windPetals = [];

    // Edle, sichtbare Farben für Stiele und Blüten
    const palettes = [
        { bark: '#4a2e2b', highlight: '#9c6f66', baseHue: 335 }, // Kirschholz & Pink
        { bark: '#2a3b2c', highlight: '#7d9e83', baseHue: 315 }, // Eukalyptusgrün & Magenta
        { bark: '#362938', highlight: '#8a718f', baseHue: 350 }  // Dunkle Pflaume & Lachsrosa
    ];

    // --- LEISTUNGSOPTIMIERTE FALLENDE BLÄTTER ---
    class WindPetal {
        constructor(x, y, hue) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 1) * 2 - 1;
            this.gravity = 0.12;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.1;
            this.size = 5 + Math.random() * 4;
            this.flip = Math.random() * Math.PI;
            this.flipSpeed = 0.04 + Math.random() * 0.04;
            
            // Farbverlauf EINMALIG generieren spart extrem viel Leistung!
            this.grad = ctx.createLinearGradient(0, 0, 0, 1);
            this.grad.addColorStop(0, `hsla(${hue}, 90%, 80%, 0.9)`);
            this.grad.addColorStop(1, `hsla(${hue}, 80%, 50%, 0.7)`);
        }
        update() {
            this.vy += this.gravity;
            this.x += this.vx; this.y += this.vy;
            this.rotation += this.rotSpeed;
            this.flip += this.flipSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.scale(Math.sin(this.flip) * this.size, this.size); // Skaliert das gecachte 1x1 Muster
            
            ctx.fillStyle = this.grad;
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.bezierCurveTo(1, 0.3, 0.5, 1, 0, 1);
            ctx.bezierCurveTo(-0.5, 1, -1, 0.3, 0, 0);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- HOCHLEISTUNGS-BLÜTEN ---
    class FastBloom {
        constructor(x, y, angle, baseHue, depthLevel) {
            this.x = x; this.y = y; this.angle = angle;
            
            this.depthLevel = depthLevel; 
            this.maxSize = (9 + Math.random() * 6) * (1 - this.depthLevel * 0.12); 
            
            this.hue = baseHue + (Math.random() - 0.5) * 40; 
            this.lightness = 75 - (this.depthLevel * 10); 
            
            this.progress = 0;
            this.delay = Math.random() * 0.4; 
            
            this.petalCount = 5 + Math.floor(Math.random() * 2);
            this.layers = 2 + Math.floor(Math.random() * 2);
            
            this.gradients = [];
            this.initGradients(); // Vorladen für flüssiges Laufen!
        }

        initGradients() {
            // Erstellt die Radial-Gradients einmalig beim Spawnen, nicht 60x pro Sekunde
            for (let l = this.layers; l > 0; l--) {
                let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
                let cInner = `hsla(${this.hue}, 90%, ${this.lightness + 15}%, 0.95)`;
                let cOuter = `hsla(${this.hue}, 85%, ${this.lightness - 15}%, 0.8)`;
                grad.addColorStop(0, cInner);
                grad.addColorStop(1, cOuter);
                this.gradients[l] = grad;
            }
        }

        update(globalProgress) {
            if (globalProgress > this.delay) {
                if (this.progress < 1) {
                    this.progress += 0.03; 
                    if (this.progress > 1) this.progress = 1;
                }
            }
        }

        draw(ctx) {
            if (this.progress <= 0) return;

            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            let scale = Math.sin(this.progress * Math.PI / 2) * this.maxSize;
            ctx.scale(scale, scale);

            for (let l = this.layers; l > 0; l--) {
                let layerScale = l / this.layers;
                
                ctx.fillStyle = this.gradients[l];
                
                let offset = (Math.PI * 2 / this.petalCount) * 0.5 * l;
                for (let i = 0; i < this.petalCount; i++) {
                    ctx.save();
                    ctx.rotate((Math.PI * 2 / this.petalCount) * i + offset);
                    ctx.scale(layerScale, layerScale); // Skaliert das 1x1 Muster
                    
                    let w = 0.6;
                    
                    // Zeichnet das Blatt basierend auf einer Größe von 1
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.bezierCurveTo(w, 0.4, w*0.8, 1, 0, 0.9);
                    ctx.bezierCurveTo(-w*0.8, 1, -w, 0.4, 0, 0);
                    ctx.fill();
                    
                    ctx.strokeStyle = `hsla(${this.hue}, 50%, 90%, 0.4)`;
                    ctx.lineWidth = 0.05;
                    ctx.beginPath();
                    ctx.moveTo(0,0); ctx.lineTo(0, 0.7);
                    ctx.stroke();
                    
                    ctx.restore();
                }
            }

            // Staubgefäße
            if (this.progress > 0.6 && this.maxSize > 6) {
                ctx.globalAlpha = (this.progress - 0.6) * 2;
                ctx.strokeStyle = `hsla(${this.hue}, 80%, 40%, 0.9)`;
                ctx.lineWidth = 0.05;
                ctx.fillStyle = '#ffda75';
                
                for(let i=0; i<7; i++) {
                    let a = Math.random() * Math.PI*2;
                    let d = Math.random() * 0.3;
                    
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*d, Math.sin(a)*d); ctx.stroke();
                    ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, 0.08, 0, Math.PI*2); ctx.fill();
                }
            }
            ctx.restore();
        }
    }

    // --- ORGANISCHER, SICHTBARER STRAUCH ---
    class SmoothBush {
        constructor(x, y) {
            this.x = x; this.y = y;
            this.palette = palettes[Math.floor(Math.random() * palettes.length)];
            
            this.branches = []; 
            this.blooms = [];   
            this.globalProgress = 0; 
            this.isFinished = false;
            
            let baseAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.2;
            
            // Breiterer, auffälligerer Hauptstamm
            this.generateBranch(this.x, this.y, baseAngle, 85 + Math.random()*30, 14, 0, 4);
            
            this.blooms.sort((a, b) => b.depthLevel - a.depthLevel);
        }

        generateBranch(startX, startY, angle, length, width, depth, maxDepth) {
            let endX = startX + Math.cos(angle) * length;
            let endY = startY + Math.sin(angle) * length;
            let delay = depth * 0.15; 
            
            let cpX = (startX + endX)/2 + Math.sin(angle)*(length*0.2);
            let cpY = (startY + endY)/2 + Math.cos(angle)*(length*0.2);
            
            this.branches.push({
                x1: startX, y1: startY, cpX: cpX, cpY: cpY, x2: endX, y2: endY,
                w: width, delay: delay
            });

            if (depth < maxDepth) {
                // Etwas weniger Verzweigungen für bessere Performance, dafür dichtere Blüten!
                let numBranches = depth === 0 ? 2 : (Math.random() > 0.4 ? 2 : 1);
                
                for (let i = 0; i < numBranches; i++) {
                    let newAngle = angle + (Math.random() - 0.5) * 1.2;
                    let newLen = length * (0.6 + Math.random() * 0.3);
                    let newWidth = width * 0.65; // Verjüngt sich sanfter, bleibt besser sichtbar
                    this.generateBranch(endX, endY, newAngle, newLen, newWidth, depth + 1, maxDepth);
                }
                
                // Seitliche Blüten am Stamm!
                if (depth > 1 && Math.random() > 0.3) {
                    this.blooms.push(new FastBloom(endX, endY, angle + 1.5, this.palette.baseHue, depth));
                    this.blooms.push(new FastBloom(endX, endY, angle - 1.5, this.palette.baseHue, depth));
                }

            } else {
                // Ein Cluster aus 3-5 Blüten am Ast-Ende
                let numBlooms = 3 + Math.floor(Math.random()*3); 
                for(let b = 0; b < numBlooms; b++) {
                    let bAngle = angle + (Math.random()-0.5)*2;
                    let offsetX = endX + (Math.random()-0.5)*20;
                    let offsetY = endY + (Math.random()-0.5)*20;
                    let dLevel = Math.random() * 2; 
                    
                    this.blooms.push(new FastBloom(offsetX, offsetY, bAngle, this.palette.baseHue, dLevel));
                }
            }
        }

        update() {
            if (this.globalProgress < 2) { 
                this.globalProgress += 0.015; 
            } else {
                this.isFinished = true;
            }
            this.blooms.forEach(b => b.update(this.globalProgress - 0.6)); 
        }

        drawStems(ctx) {
            ctx.lineCap = 'round';
            this.branches.forEach(b => {
                if (this.globalProgress > b.delay) {
                    let p = Math.min(1, (this.globalProgress - b.delay) * 4); 
                    
                    let curX = Math.pow(1-p, 2)*b.x1 + 2*(1-p)*p*b.cpX + Math.pow(p,2)*b.x2;
                    let curY = Math.pow(1-p, 2)*b.y1 + 2*(1-p)*p*b.cpY + Math.pow(p,2)*b.y2;
                    let curCpX = (b.x1 + curX)/2;
                    let curCpY = (b.y1 + curY)/2;

                    // 1. Dunkle, dicke Rinde (Sichtbarkeit!)
                    ctx.beginPath();
                    ctx.moveTo(b.x1, b.y1);
                    ctx.quadraticCurveTo(curCpX, curCpY, curX, curY);
                    ctx.strokeStyle = this.palette.bark;
                    ctx.lineWidth = b.w;
                    ctx.stroke();

                    // 2. Heller Lichtkante (lässt den Stamm dreidimensional wirken)
                    ctx.beginPath();
                    ctx.moveTo(b.x1, b.y1);
                    ctx.quadraticCurveTo(curCpX, curCpY, curX, curY);
                    ctx.strokeStyle = this.palette.highlight;
                    ctx.lineWidth = b.w * 0.35;
                    ctx.stroke();
                }
            });
        }

        drawBlooms(ctx) {
            this.blooms.forEach(b => b.draw(ctx));
        }

        shatter(arr) {
            this.blooms.forEach(b => {
                if (b.progress > 0.5) {
                    let count = 2 + Math.floor(Math.random()*3);
                    for(let i=0; i<count; i++) {
                        arr.push(new WindPetal(b.x, b.y, b.hue));
                    }
                }
            });
        }
    }

    function spawnPlant(x, y) {
        plants.push(new SmoothBush(x, y));
        // Max 10 Pflanzen. Dank der Optimierung läuft das jetzt absolut flüssig!
        if (plants.length > 10) plants.shift(); 
    }

    function triggerClear() {
        if(plants.length === 0) return;
        plants.forEach(p => p.shatter(windPetals));
        plants = []; 
    }

    // --- EINGABEN ---
    let lastTap = 0;
    function handleTouch(e) {
        // Verhindert doppeltes Auslösen auf manchen Handys
        let now = Date.now();
        if (now - lastTap < 100) return;
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnPlant(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('touchstart', handleTouch, {passive: true});

    // --- SCHÜTTEL-ERKENNUNG ---
    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 25) {
                triggerClear();
            }
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }
    
    // Für den PC (Doppelklick zum Löschen)
    window.addEventListener('dblclick', triggerClear);

    // --- RENDER LOOP ---
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        plants.forEach(p => p.update());
        
        // Erst Stämme, dann Blüten
        plants.forEach(p => p.drawStems(ctx));
        plants.forEach(p => p.drawBlooms(ctx));

        // Schüttel-Effekt
        for(let i = windPetals.length - 1; i >= 0; i--) {
            let wp = windPetals[i];
            wp.update();
            wp.draw(ctx);
            if (wp.y > canvas.height + 50) windPetals.splice(i, 1);
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
