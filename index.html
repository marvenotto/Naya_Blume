<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - Generative 3D Botanik</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: radial-gradient(circle at center, #1c1524 0%, #0a0810 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.2); letter-spacing: 6px; font-size: 11px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let fallingPetals = [];

    // Professionelle, plastische Farbpaletten
    const palettes = [
        { stemDark: '#1a0e14', stemLight: '#4a2538', core: '#420b23', shadow: '#8a2354', mid: '#d4487b', highlight: '#ffb3c6' }, // Warmes Rosa/Weinrot
        { stemDark: '#0e1a14', stemLight: '#274a38', core: '#2b0413', shadow: '#5c1049', mid: '#b83b70', highlight: '#ff9e7d' }, // Pfirsich/Magenta (wie dein Bild)
        { stemDark: '#11131c', stemLight: '#2c334a', core: '#1a0826', shadow: '#4a154b', mid: '#9c2a6b', highlight: '#fbc5d6' }, // Kühl & Edel (Silberrosa/Lila)
    ];

    // --- FALLENDE BLÄTTER ---
    class FallingPetal {
        constructor(x, y, p, size) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 5;
            this.vy = (Math.random() - 1) * 3 - 1;
            this.gravity = 0.1 + Math.random() * 0.05;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.1;
            this.size = size * (0.3 + Math.random() * 0.4);
            this.palette = p;
            this.flip = Math.random() * Math.PI; 
            this.flipSpeed = 0.04 + Math.random() * 0.06;
        }
        update() {
            this.vy += this.gravity; this.x += this.vx; this.y += this.vy;
            this.rotation += this.rotSpeed; this.flip += this.flipSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.scale(Math.sin(this.flip), 1); 
            
            let grad = ctx.createLinearGradient(0, 0, 0, this.size);
            grad.addColorStop(0, this.palette.highlight);
            grad.addColorStop(1, this.palette.shadow);
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(this.size*0.5, this.size*0.3, this.size*0.4, this.size*0.8, 0, this.size);
            ctx.bezierCurveTo(-this.size*0.4, this.size*0.8, -this.size*0.5, this.size*0.3, 0, 0);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- DIE UNIKAT-BLÜTE ---
    class UniqueBloom {
        constructor(x, y, angle, size, palette) {
            this.x = x; this.y = y;
            this.baseAngle = angle;
            this.targetSize = size;
            this.palette = palette;
            this.progress = 0;
            this.petals = [];
            
            // DNA der Blüte generieren (Jede ist anders!)
            this.dna = {
                shapeType: Math.floor(Math.random() * 4), // 4 radikal andere Blattformen
                layers: 2 + Math.floor(Math.random() * 3), // 2 bis 4 Schichten
                petalCount: 4 + Math.floor(Math.random() * 5), // 4 bis 8 Blätter pro Schicht
                widthMod: 0.3 + Math.random() * 0.4, // Sehr schmal bis sehr breit
                centerChaos: Math.random() * 0.5 // Wie organisch unordentlich die Blätter liegen
            };
            
            this.generatePetals();
        }

        generatePetals() {
            for (let l = this.dna.layers; l > 0; l--) {
                let layerSize = this.targetSize * (l / this.dna.layers);
                // Innere Schichten haben manchmal weniger Blätter
                let pCount = this.dna.petalCount + (l === this.dna.layers ? 2 : 0); 
                let offset = (Math.PI * 2 / pCount) * 0.5 * l; 

                for (let i = 0; i < pCount; i++) {
                    let angle = (Math.PI * 2 / pCount) * i + offset + this.baseAngle;
                    this.petals.push({
                        angle: angle + (Math.random()-0.5) * this.dna.centerChaos, 
                        size: layerSize * (0.85 + Math.random()*0.15),
                        delay: 1 - (l / this.dna.layers) 
                    });
                }
            }
        }

        update() {
            if (this.progress < 1) {
                this.progress += 0.015; 
                if (this.progress > 1) this.progress = 1;
            }
        }

        draw(ctx) {
            if (this.progress === 0) return;
            ctx.save();
            ctx.translate(this.x, this.y);

            let bloomScale = Math.sin(this.progress * Math.PI / 2); // Sanftes Ploppen
            ctx.scale(bloomScale, bloomScale);

            this.petals.forEach(p => {
                let pGrowth = Math.max(0, Math.min(1, (this.progress - p.delay * 0.3) * 2));
                if (pGrowth <= 0) return;
                
                let s = p.size * Math.pow(pGrowth, 0.7);
                let w = s * this.dna.widthMod;
                
                ctx.save();
                ctx.rotate(p.angle);
                
                // Formeln für die 4 einzigartigen Blütenblatt-Formen
                let cp1x, cp1y, cp2x, cp2y;
                if (this.dna.shapeType === 0) { // Lotus (Spitz)
                    cp1x = w * 1.2; cp1y = s * 0.3; cp2x = w * 0.6; cp2y = s * 0.8;
                } else if (this.dna.shapeType === 1) { // Pfingstrose (Rund, füllig)
                    cp1x = w * 1.5; cp1y = s * 0.5; cp2x = w * 1.2; cp2y = s * 1.0;
                } else if (this.dna.shapeType === 2) { // Lilie (Schmal, geschwungen)
                    cp1x = w * 0.5; cp1y = s * 0.2; cp2x = w * 0.8; cp2y = s * 0.9;
                } else { // Exotisch (Breite Mitte, spitze Enden)
                    cp1x = w * 1.8; cp1y = s * 0.6; cp2x = w * 0.2; cp2y = s * 0.9;
                }

                // 3D-Volumen: Rechte Hälfte (Licht)
                let gradR = ctx.createLinearGradient(0, 0, w, s);
                gradR.addColorStop(0, this.palette.core);
                gradR.addColorStop(0.4, this.palette.mid);
                gradR.addColorStop(1, this.palette.highlight);
                ctx.fillStyle = gradR;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, 0, s);
                ctx.lineTo(0, 0); ctx.fill();

                // 3D-Volumen: Linke Hälfte (Schatten)
                let gradL = ctx.createLinearGradient(0, 0, -w, s);
                gradL.addColorStop(0, this.palette.core);
                gradL.addColorStop(0.6, this.palette.shadow);
                gradL.addColorStop(1, this.palette.mid);
                ctx.fillStyle = gradL;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-cp1x, cp1y, -cp2x, cp2y, 0, s);
                ctx.lineTo(0, 0); ctx.fill();

                ctx.restore();
            });

            // Das Innere der Blüte (Staubgefäße)
            if (this.progress > 0.5) {
                ctx.globalAlpha = (this.progress - 0.5) * 2;
                for(let i = 0; i < 15; i++) {
                    let a = Math.random() * Math.PI * 2;
                    let d = Math.random() * (this.targetSize * 0.25);
                    ctx.strokeStyle = this.palette.highlight;
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*d, Math.sin(a)*d); ctx.stroke();
                    
                    ctx.fillStyle = '#ffda75'; // Gold
                    ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, 1.5 + Math.random(), 0, Math.PI*2); ctx.fill();
                }
            }
            ctx.restore();
        }
    }

    // --- DIE KOMPLEXE 3D PFLANZE (Mit massiven Ästen) ---
    class MajesticBranch {
        constructor(startX, startY, angle, length, baseWidth, depth, palette, isMain) {
            this.startX = startX; this.startY = startY; 
            this.angle = angle; this.length = length;
            this.baseWidth = baseWidth; this.depth = depth; 
            this.palette = palette;
            this.isMain = isMain;
            
            this.progress = 0; 
            this.speed = 0.012 + Math.random() * 0.005; 
            
            this.children = [];
            this.bloom = null;
            this.isFinished = false;
            
            this.curve = (Math.random() - 0.5) * 0.8; 
            this.endX = this.startX; 
            this.endY = this.startY;
        }

        update() {
            if (this.progress < 1) {
                this.progress += this.speed;
                if (this.progress > 1) this.progress = 1;
            } 
            
            if (this.progress >= 1 && !this.isFinished) {
                this.isFinished = true;
                this.endX = this.startX + Math.cos(this.angle + this.curve) * this.length;
                this.endY = this.startY + Math.sin(this.angle + this.curve) * this.length;
                
                // Bis zu 3 Ebenen Tiefe für eine buschige Struktur
                if (this.depth < 2) {
                    // Hauptast fortsetzen
                    let mainAngle = this.angle + (Math.random() - 0.5) * 0.4;
                    let mainLen = this.length * (0.7 + Math.random() * 0.2);
                    this.children.push(new MajesticBranch(this.endX, this.endY, mainAngle, mainLen, this.baseWidth * 0.65, this.depth + 1, this.palette, true));
                    
                    // 1-2 kräftige Seitenäste generieren, die eigene Blüten tragen
                    let sideCount = Math.random() > 0.3 ? 2 : 1;
                    for (let i = 0; i < sideCount; i++) {
                        let sideAngle = this.angle + (Math.random() > 0.5 ? 1 : -1) * (0.6 + Math.random() * 0.6);
                        let sideLen = this.length * (0.5 + Math.random() * 0.3); 
                        this.children.push(new MajesticBranch(this.endX, this.endY, sideAngle, sideLen, this.baseWidth * 0.45, this.depth + 1, this.palette, false));
                    }
                } else {
                    // JEDES Ast-Ende bekommt jetzt eine Blüte! 
                    // Hauptäste riesig, Nebenäste mittelgroß.
                    let bloomSize = this.isMain ? (35 + Math.random() * 20) : (15 + Math.random() * 15);
                    
                    // Manchmal mischt sich die Farbe der Blüten innerhalb einer Pflanze ganz leicht
                    let p = palettes[Math.floor(Math.random() * palettes.length)];
                    this.bloom = new UniqueBloom(this.endX, this.endY, this.angle, bloomSize, this.palette);
                }
            }

            this.children.forEach(c => c.update());
            if (this.bloom) this.bloom.update();
        }

        drawStems(ctx) {
            let curX = this.startX + Math.cos(this.angle + this.curve) * this.length * this.progress;
            let curY = this.startY + Math.sin(this.angle + this.curve) * this.length * this.progress;
            
            let cpX = (this.startX + curX) / 2 + Math.sin(this.angle) * (this.length * 0.2);
            let cpY = (this.startY + curY) / 2 + Math.cos(this.angle) * (this.length * 0.2);

            // 3D Stamm-Effekt: Erst dunkel und breit (Schatten/Volumen)
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            ctx.quadraticCurveTo(cpX, cpY, curX, curY);
            ctx.strokeStyle = this.palette.stemDark;
            ctx.lineWidth = this.baseWidth;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Dann hell und dünner (Highlight), um den Stamm plastisch und dick wirken zu lassen
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY);
            ctx.quadraticCurveTo(cpX, cpY, curX, curY);
            ctx.strokeStyle = this.palette.stemLight;
            ctx.lineWidth = this.baseWidth * 0.5;
            ctx.stroke();

            this.children.forEach(c => c.drawStems(ctx));
        }

        drawBlooms(ctx) {
            if (this.bloom) this.bloom.draw(ctx);
            this.children.forEach(c => c.drawBlooms(ctx));
        }

        shatter(arr) {
            if (this.bloom && this.bloom.progress > 0.5) {
                let count = this.isMain ? 15 : 6;
                for(let i=0; i < count; i++) {
                    arr.push(new FallingPetal(
                        this.bloom.x + (Math.random()-0.5)*20, 
                        this.bloom.y + (Math.random()-0.5)*20, 
                        this.palette, this.bloom.targetSize
                    ));
                }
            }
            this.children.forEach(c => c.shatter(arr));
        }
    }

    class PlantSystem {
        constructor(x, y) {
            let p = palettes[Math.floor(Math.random() * palettes.length)];
            let mainAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.3;
            // Extrem dicker, präsenter Hauptstamm (Breite: 14)
            this.root = new MajesticBranch(x, y, mainAngle, 100 + Math.random() * 50, 14, 0, p, true);
        }
        update() { this.root.update(); }
        drawStems(ctx) { this.root.drawStems(ctx); }
        drawBlooms(ctx) { this.root.drawBlooms(ctx); }
        shatter(arr) { this.root.shatter(arr); }
    }

    function spawnPlant(x, y) {
        plants.push(new PlantSystem(x, y));
        // Wegen der extremen Details auf 4 Pflanzen limitieren
        if (plants.length > 4) plants.shift(); 
    }

    function triggerShake() {
        if(plants.length === 0) return;
        plants.forEach(p => p.shatter(fallingPetals));
        plants = []; 
    }

    // --- EINGABEN ---
    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        if (now - lastTap < 300) { triggerShake(); lastTap = 0; return; }
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnPlant(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('dblclick', triggerShake);

    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 20) triggerShake();
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }

    // --- RENDER LOOP ---
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        plants.forEach(p => p.update());
        
        // Stämme im Hintergrund
        plants.forEach(p => p.drawStems(ctx));
        
        // Alle Blüten (Haupt- und Nebenblüten) im Vordergrund
        plants.forEach(p => p.drawBlooms(ctx));

        // Schüttel-Effekt
        for(let i = fallingPetals.length - 1; i >= 0; i--) {
            let obj = fallingPetals[i];
            obj.update();
            obj.draw(ctx);
            if (obj.y > canvas.height + 100) fallingPetals.splice(i, 1);
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
