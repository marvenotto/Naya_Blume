<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #070508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 35px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.4); letter-spacing: 4px; font-size: 13px;
            pointer-events: none; text-transform: uppercase; animation: fadeIn 3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let structures = [];
    let fallingObjects = [];

    // Edle Pink- und Rosatöne für Naya
    const palettes = [
        { stem: '#1a2e20', branch: '#3b5c43', c1: 'rgba(255,228,225,0.9)', c2: 'rgba(255,182,193,0.8)' },
        { stem: '#241024', branch: '#4a244a', c1: 'rgba(255,105,180,0.9)', c2: 'rgba(199,21,133,0.8)' },
        { stem: '#2b141e', branch: '#54263a', c1: 'rgba(255,240,245,0.9)', c2: 'rgba(255,20,147,0.7)' },
        { stem: '#1f1c23', branch: '#3e3747', c1: 'rgba(248,200,220,0.9)', c2: 'rgba(216,112,147,0.8)' }
    ];

    // --- ZERFALLENDE BLÜTENBLÄTTER ---

    class FallingPetal {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 6; 
            this.vy = (Math.random() - 1) * 2 - 1; 
            this.gravity = 0.15;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.1;
            this.size = Math.random() * 2 + 1;
            this.color = color;
        }
        update() {
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.rotSpeed;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size * 2, this.size, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // --- KOMPLEXE PFLANZEN ---

    // Zeichnet ein absolutes Unikat von Blüte
    function drawDetailedBloom(ctx, x, y, size, rotation, dna) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);

        // Blüten-Ebenen (von hinten nach vorne)
        for (let layer = 0; layer < dna.layers; layer++) {
            let currentSize = size * (1 - layer * 0.35); // Jede Schicht wird kleiner
            ctx.fillStyle = layer % 2 === 0 ? dna.color2 : dna.color1;
            
            ctx.beginPath();
            // Zeichnet die Blätter mathematisch mit Sinus-Wellen für perfekte Symmetrie
            for (let angle = 0; angle <= Math.PI * 2; angle += 0.05) {
                // Berechnet die Form: glatt, gewellt, spitz
                let r = currentSize + Math.sin(angle * dna.petalCount) * (currentSize * dna.ruffle);
                let px = Math.cos(angle) * r;
                let py = Math.sin(angle) * r;
                if (angle === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
        }

        // Detaillierte Staubgefäße in der Mitte (Pistils)
        ctx.fillStyle = '#ffda75'; // Zartes Gold
        for (let i = 0; i < dna.stamens; i++) {
            let a = Math.random() * Math.PI * 2;
            let d = Math.random() * (size * 0.25);
            ctx.beginPath();
            ctx.arc(Math.cos(a) * d, Math.sin(a) * d, size * 0.08, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }

    class UniquePlant {
        constructor(x, y, angle, length, width, depth, dna) {
            this.x = x; this.y = y; 
            this.angle = angle; this.length = length;
            this.width = width; this.depth = depth; 
            this.dna = dna;
            this.progress = 0;
            this.speed = 0.012 + Math.random() * 0.015; // Elegantes, ruhiges Wachstum
            this.children = [];
            this.hasGrownChildren = false;
            
            // Jede Linie hat einen ganz eigenen, sanften Schwung
            this.curve = (Math.random() - 0.5) * dna.curviness; 
            this.endX = this.x; this.endY = this.y;
        }

        update() {
            if (this.progress < 1) {
                this.progress += this.speed;
                if (this.progress > 1) this.progress = 1;
            } else if (!this.hasGrownChildren && this.depth < this.dna.maxDepth) {
                this.hasGrownChildren = true;
                this.endX = this.x + Math.cos(this.angle + this.curve) * this.length;
                this.endY = this.y + Math.sin(this.angle + this.curve) * this.length;
                
                // Pflanzenart entscheidet über Verzweigung (buschig vs. filigran)
                let branches = this.dna.branching === 'high' ? (2 + Math.floor(Math.random() * 3)) : (1 + Math.floor(Math.random() * 2));
                
                // Letzte Äste haben keine weiteren Verzweigungen mehr
                if (this.depth === this.dna.maxDepth - 1) branches = 0;

                for (let i = 0; i < branches; i++) {
                    let newAngle = this.angle + (Math.random() - 0.5) * 1.5;
                    let newLength = this.length * (0.6 + Math.random() * 0.25);
                    this.children.push(new UniquePlant(this.endX, this.endY, newAngle, newLength, this.width * 0.65, this.depth + 1, this.dna));
                }
            }
            this.children.forEach(child => child.update());
        }

        draw() {
            let curX = this.x + Math.cos(this.angle + this.curve) * this.length * this.progress;
            let curY = this.y + Math.sin(this.angle + this.curve) * this.length * this.progress;
            
            if(this.progress === 1 && !this.hasGrownChildren) {
                this.endX = curX; this.endY = curY;
            }

            // Zeichne den Stängel
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            let cpX = (this.x + curX) / 2 + Math.sin(this.angle) * 12;
            let cpY = (this.y + curY) / 2 + Math.cos(this.angle) * 12;
            ctx.quadraticCurveTo(cpX, cpY, curX, curY);

            ctx.strokeStyle = this.depth < 2 ? this.dna.palette.stem : this.dna.palette.branch;
            ctx.lineWidth = Math.max(0.3, this.width);
            ctx.stroke();

            // Zeichne die Blüte am Ende des Wachstums
            if (this.progress >= 1 && this.depth >= this.dna.bloomStartDepth) {
                // Hauptblüten ganz oben sind größer als Seitenblüten
                let bSize = this.depth === this.dna.maxDepth ? this.dna.bloomSize * 1.5 : this.dna.bloomSize * 0.6;
                drawDetailedBloom(ctx, curX, curY, bSize, this.angle, this.dna);
            }

            this.children.forEach(child => child.draw());
        }
    }

    function generateBotanicDNA() {
        let p = palettes[Math.floor(Math.random() * palettes.length)];
        return {
            palette: p,
            color1: p.c1,
            color2: p.c2,
            // Struktur der Pflanze
            maxDepth: Math.floor(Math.random() * 2) + 4, // 4 oder 5 Ebenen tief
            branching: Math.random() > 0.5 ? 'high' : 'low',
            curviness: Math.random() * 0.8 + 0.4,
            // Struktur der Blüte (Absolutes Unikat)
            bloomStartDepth: 3, 
            bloomSize: Math.random() * 3 + 2.5,
            petalCount: Math.floor(Math.random() * 8) + 4, // 4 bis 11 Blütenblätter
            ruffle: Math.random() * 0.4, // Glatt (0) bis stark gewellt (0.4)
            layers: Math.floor(Math.random() * 3) + 1, // 1 bis 3 Ebenen übereinander
            stamens: Math.floor(Math.random() * 15) + 5 // 5 bis 20 Staubgefäße
        };
    }

    function spawnStructure(x, y) {
        let dna = generateBotanicDNA();
        let mainAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.5;
        // Feine, elegante Startdicke (2.2)
        structures.push(new UniquePlant(x, y, mainAngle, 65 + Math.random() * 30, 2.2, 0, dna));
    }

    function breakIntoLeaves(branch) {
        if (branch.progress >= 1 && branch.depth >= branch.dna.bloomStartDepth) {
            // Lässt Blütenblätter in der Farbe der Blume regnen
            for(let i=0; i<3; i++) {
                fallingObjects.push(new FallingPetal(branch.endX, branch.endY, branch.dna.color2));
            }
        }
        branch.children.forEach(c => breakIntoLeaves(c));
    }

    function triggerShake() {
        if(structures.length === 0) return;
        structures.forEach(s => breakIntoLeaves(s));
        structures = []; 
    }

    // --- INTERAKTIONEN ---

    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        // Doppeltippen löst jetzt auch den Schüttel-Zerfall aus!
        if (now - lastTap < 300) {
            triggerShake();
            lastTap = 0; 
            return;
        }
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnStructure(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('dblclick', triggerShake); // Für den PC

    if (window.DeviceMotionEvent) {
        let lx = 0, ly = 0, lz = 0;
        window.addEventListener('devicemotion', (e) => {
            let acc = e.accelerationIncludingGravity;
            if (!acc) return;
            if (Math.abs(acc.x - lx) + Math.abs(acc.y - ly) + Math.abs(acc.z - lz) > 25) {
                triggerShake();
            }
            lx = acc.x; ly = acc.y; lz = acc.z;
        });
    }

    // --- ANIMATION ---

    function animate() {
        ctx.fillStyle = 'rgba(7, 5, 8, 0.2)'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        structures.forEach(s => {
            s.update();
            s.draw();
        });

        for(let i = fallingObjects.length - 1; i >= 0; i--) {
            let obj = fallingObjects[i];
            obj.update();
            obj.draw();
            if (obj.y > canvas.height + 50) {
                fallingObjects.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
