<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für Naya - High-End Botany</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: linear-gradient(to bottom, #110e17 0%, #050408 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas { 
            display: block; width: 100%; height: 100%; 
            touch-action: none;
        }
        .dedication {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 182, 193, 0.2); letter-spacing: 6px; font-size: 11px;
            font-weight: 300; pointer-events: none; text-transform: uppercase;
            animation: fadeIn 5s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="dedication">Für Naya</div>
<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let plants = [];
    let particles = [];

    // Edle, realistische Farbpaletten (Schatten, Mitte, Highlight)
    const palettes = [
        { branchDark: '#121c15', branchLight: '#2c4233', inner: '#ffb3c6', mid: '#d4487b', outer: '#420b23', stamen: '#ffda75' }, 
        { branchDark: '#1a0f14', branchLight: '#402633', inner: '#ff9e7d', mid: '#b83b70', outer: '#2b0413', stamen: '#ffeb99' }, 
        { branchDark: '#0e111a', branchLight: '#232a3d', inner: '#fbc5d6', mid: '#9c2a6b', outer: '#1a0826', stamen: '#ffd700' },
        { branchDark: '#171410', branchLight: '#3d362e', inner: '#fff0f5', mid: '#e66786', outer: '#591629', stamen: '#fff5cc' }
    ];

    // --- DIE 4 RADIKAL UNTERSCHIEDLICHEN BLÜTEN-TYPEN ---
    class MasterBloom {
        constructor(x, y, angle, size, type, palette) {
            this.x = x; this.y = y;
            this.angle = angle;
            this.targetSize = size;
            this.type = type; // 0: Lotus, 1: Spider, 2: Peony, 3: Orchid
            this.palette = palette;
            this.progress = 0;
            this.petals = [];
            this.initPetals();
        }

        initPetals() {
            if (this.type === 0) {
                // Typ 0: LOTUS (3D Knick, spitz, ca. 16 Blätter)
                for (let l = 3; l > 0; l--) {
                    let count = 5 + l;
                    let lSize = this.targetSize * (l/3);
                    for (let i = 0; i < count; i++) {
                        this.petals.push({
                            a: (Math.PI*2/count)*i + (l%2)*0.3 + (Math.random()-0.5)*0.1,
                            s: lSize, w: 0.4 + Math.random()*0.1, delay: 1 - (l/3)
                        });
                    }
                }
            } else if (this.type === 1) {
                // Typ 1: SPIDER LILY (60+ hauchdünne, extrem lange Nadeln)
                let count = 65;
                for (let i = 0; i < count; i++) {
                    this.petals.push({
                        a: (Math.PI*2/count)*i + (Math.random()-0.5)*0.5,
                        s: this.targetSize * (0.5 + Math.random()*0.7), // Sehr unterschiedlich lang
                        w: 0.05 + Math.random()*0.03, // Hauchdünn
                        curve: (Math.random()-0.5)*1.5, // Krümmung der Nadel
                        delay: Math.random() * 0.5
                    });
                }
            } else if (this.type === 2) {
                // Typ 2: PEONY (Riesig, kreisrund, transparent, wellig)
                for (let l = 4; l > 0; l--) {
                    let count = 4 + l*2;
                    let lSize = this.targetSize * (l/4);
                    for (let i = 0; i < count; i++) {
                        this.petals.push({
                            a: (Math.PI*2/count)*i + (Math.random()-0.5)*0.4,
                            s: lSize * (0.9+Math.random()*0.2), w: 1.2 + Math.random()*0.4, // Extrem breit
                            delay: 1 - (l/4)
                        });
                    }
                }
            } else {
                // Typ 3: ORCHID (Wenige, aber riesige und organische Blätter)
                let angles = [0, 1.2, -1.2, 2.5, -2.5]; // Feste, asymmetrische Anordnung
                angles.forEach((a, index) => {
                    this.petals.push({
                        a: a + (Math.random()-0.5)*0.2,
                        s: this.targetSize * (index < 3 ? 1.2 : 0.7), // Hintere groß, vordere klein
                        w: 0.6 + Math.random()*0.2, delay: index * 0.1
                    });
                });
            }
        }

        update() {
            if (this.progress < 1) {
                this.progress += 0.01; // Sehr sanftes Aufblühen
                if (this.progress > 1) this.progress = 1;
            }
        }

        draw(ctx) {
            if (this.progress === 0) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            let globalScale = Math.sin(this.progress * Math.PI / 2);
            ctx.scale(globalScale, globalScale);

            // Jede Blüte wird komplett anders gezeichnet!
            this.petals.forEach(p => {
                let growth = Math.max(0, Math.min(1, (this.progress - p.delay * 0.5) * 2));
                if (growth <= 0) return;
                
                let s = p.s * Math.pow(growth, 0.7);
                let w = s * p.w;

                ctx.save();
                ctx.rotate(this.angle + p.a); // Rotiere in Wuchsrichtung + Blattwinkel

                if (this.type === 0) {
                    // --- RENDERER 1: LOTUS (3D Knick) ---
                    let gradR = ctx.createLinearGradient(0,0,w,s);
                    gradR.addColorStop(0, this.palette.outer); gradR.addColorStop(0.5, this.palette.mid); gradR.addColorStop(1, this.palette.inner);
                    ctx.fillStyle = gradR;
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(w*1.2, s*0.3, w*0.8, s*0.8, 0, s); ctx.lineTo(0,0); ctx.fill();
                    
                    let gradL = ctx.createLinearGradient(0,0,-w,s);
                    gradL.addColorStop(0, this.palette.outer); gradL.addColorStop(0.8, this.palette.mid);
                    ctx.fillStyle = gradL;
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-w*1.2, s*0.3, -w*0.8, s*0.8, 0, s); ctx.lineTo(0,0); ctx.fill();

                } else if (this.type === 1) {
                    // --- RENDERER 2: SPIDER LILY (Feine Nadeln) ---
                    let grad = ctx.createLinearGradient(0,0, 0,s);
                    grad.addColorStop(0, this.palette.outer); grad.addColorStop(1, this.palette.inner);
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.moveTo(0,0);
                    // Dünne Kurve nach oben, und wieder zurück
                    ctx.quadraticCurveTo(w + p.curve*s, s*0.5, p.curve*s*1.5, s);
                    ctx.quadraticCurveTo(-w + p.curve*s, s*0.5, 0, 0);
                    ctx.fill();

                } else if (this.type === 2) {
                    // --- RENDERER 3: PEONY (Riesig, transparent, überlappend) ---
                    let grad = ctx.createRadialGradient(0, s*0.5, 0, 0, s*0.5, s);
                    grad.addColorStop(0, this.palette.outer); grad.addColorStop(0.5, this.palette.mid); grad.addColorStop(1, this.palette.inner);
                    ctx.fillStyle = grad;
                    ctx.globalAlpha = 0.85; // Leicht durchscheinend
                    
                    ctx.beginPath(); ctx.moveTo(0,0);
                    // Breite, bauchige Form mit leichten Wellen am Rand
                    ctx.bezierCurveTo(w, s*0.2, w*1.2, s*0.9, 0, s);
                    ctx.bezierCurveTo(-w*1.2, s*0.9, -w, s*0.2, 0, 0);
                    ctx.fill();
                    // Zarte Außenlinie
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.5; ctx.stroke();

                } else {
                    // --- RENDERER 4: ORCHID (Exotisch) ---
                    let grad = ctx.createLinearGradient(0,0,0,s);
                    grad.addColorStop(0, this.palette.inner); grad.addColorStop(1, this.palette.mid);
                    ctx.fillStyle = grad;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; // Echte Schatten!
                    
                    ctx.beginPath(); ctx.moveTo(0,0);
                    ctx.bezierCurveTo(w*1.8, s*0.4, w*0.4, s*0.8, 0, s);
                    ctx.bezierCurveTo(-w*0.4, s*0.8, -w*1.8, s*0.4, 0, 0);
                    ctx.fill();
                    ctx.shadowColor = 'transparent';
                    
                    // Zeichne das "Lippen"-Zentrum der Orchidee
                    ctx.fillStyle = this.palette.outer;
                    ctx.beginPath(); ctx.arc(0, s*0.2, w*0.3, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            });

            // Staubgefäße (nur für Lotus, Peony und Spider)
            if (this.progress > 0.6 && this.type !== 3) {
                ctx.globalAlpha = (this.progress - 0.6) * 2;
                let stamens = this.type === 1 ? 5 : 25; // Spider hat wenige, Peony viele
                for(let i=0; i<stamens; i++) {
                    let a = Math.random() * Math.PI*2;
                    let d = Math.random() * (this.targetSize * 0.25);
                    ctx.strokeStyle = this.palette.inner; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*d, Math.sin(a)*d); ctx.stroke();
                    ctx.fillStyle = this.palette.stamen;
                    ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, 1.5, 0, Math.PI*2); ctx.fill();
                }
            }
            ctx.restore();
        }
    }

    // --- DIE KOMPLEXE ZWEIG-STRUKTUR (Höhen & Äste) ---
    class BranchNode {
        constructor(startX, startY, angle, length, width, type, palette, isMain, delay) {
            this.startX = startX; this.startY = startY; 
            this.angle = angle; this.length = length;
            this.width = width; 
            this.type = type; // Alle Blüten am selben Baum haben denselben Typ
            this.palette = palette;
            this.isMain = isMain;
            
            this.progress = -delay; // Äste wachsen zeitversetzt!
            this.speed = 0.008 + Math.random() * 0.004;
            
            this.curve = (Math.random() - 0.5) * 0.5; 
            this.endX = this.startX; this.endY = this.startY;
            
            this.children = [];
            this.bloom = null;
            this.isFinished = false;
        }

        generateChildren() {
            if (this.isMain) {
                // Hauptstamm generiert 2-4 Seitenäste auf verschiedenen Höhen!
                let branches = 2 + Math.floor(Math.random()*3);
                for (let i = 1; i <= branches; i++) {
                    let heightFactor = i / (branches + 1); // Verteilt Äste auf 25%, 50%, 75% Höhe
                    let sideAngle = this.angle + (Math.random() > 0.5 ? 1 : -1) * (0.6 + Math.random()*0.4);
                    let sideLen = this.length * (0.3 + Math.random()*0.3); // Seitenäste sind kürzer
                    let sideWidth = this.width * 0.5;
                    
                    this.children.push({
                        spawnAt: heightFactor,
                        branch: new BranchNode(0, 0, sideAngle, sideLen, sideWidth, this.type, this.palette, false, 0)
                    });
                }
                
                // Am Ende des Hauptstamms wächst die KÖNIGSBLÜTE (Riesig)
                this.bloom = new MasterBloom(0, 0, this.angle, 50 + Math.random()*20, this.type, this.palette);
            } else {
                // Seitenäste bekommen kleinere Blüten (manche bleiben fast Knospen)
                let size = 15 + Math.random()*15;
                this.bloom = new MasterBloom(0, 0, this.angle, size, this.type, this.palette);
            }
        }

        update() {
            if (this.progress < 0) { this.progress += this.speed; return; }
            if (this.progress === 0 && !this.isFinished && this.children.length === 0) this.generateChildren();

            if (this.progress < 1) {
                this.progress += this.speed;
                if (this.progress > 1) this.progress = 1;
            } 
            
            this.endX = this.startX + Math.cos(this.angle + this.curve) * this.length * this.progress;
            this.endY = this.startY + Math.sin(this.angle + this.curve) * this.length * this.progress;

            // Spawne Seitenäste, wenn die Höhe erreicht ist
            this.children.forEach(c => {
                if (this.progress >= c.spawnAt) {
                    // Update Startkoordinaten des Seitenastes, falls er gerade wächst
                    if (c.branch.progress <= 0) {
                        c.branch.startX = this.startX + Math.cos(this.angle + this.curve) * this.length * c.spawnAt;
                        c.branch.startY = this.startY + Math.sin(this.angle + this.curve) * this.length * c.spawnAt;
                    }
                    c.branch.update();
                }
            });

            if (this.progress >= 1) {
                this.isFinished = true;
                if (this.bloom) {
                    this.bloom.x = this.endX; this.bloom.y = this.endY;
                    this.bloom.update();
                }
            }
        }

        drawStems(ctx) {
            if (this.progress <= 0) return;

            let curX = this.startX + Math.cos(this.angle + this.curve) * this.length * this.progress;
            let curY = this.startY + Math.sin(this.angle + this.curve) * this.length * this.progress;
            
            let cpX = (this.startX + curX)/2 + Math.sin(this.angle) * (this.length*0.1);
            let cpY = (this.startY + curY)/2 + Math.cos(this.angle) * (this.length*0.1);

            // MASSIVER 3D STAMM
            // 1. Dunkler, breiter Hintergrund (Schatten)
            ctx.beginPath(); ctx.moveTo(this.startX, this.startY);
            ctx.quadraticCurveTo(cpX, cpY, curX, curY);
            ctx.strokeStyle = this.palette.branchDark;
            ctx.lineWidth = this.width * (1 - this.progress*0.5); // Stamm verjüngt sich nach oben
            ctx.lineCap = 'round'; ctx.stroke();

            // 2. Helleres Highlight (Gibt dem Ast die runde Zylinder-Form)
            ctx.beginPath(); ctx.moveTo(this.startX, this.startY);
            ctx.quadraticCurveTo(cpX, cpY, curX, curY);
            ctx.strokeStyle = this.palette.branchLight;
            ctx.lineWidth = this.width * 0.4 * (1 - this.progress*0.5);
            ctx.stroke();

            this.children.forEach(c => { if (this.progress >= c.spawnAt) c.branch.drawStems(ctx); });
        }

        drawBlooms(ctx) {
            if (this.progress >= 1 && this.bloom) this.bloom.draw(ctx);
            this.children.forEach(c => { if (this.progress >= c.spawnAt) c.branch.drawBlooms(ctx); });
        }
    }

    class CompletePlant {
        constructor(x, y) {
            let p = palettes[Math.floor(Math.random() * palettes.length)];
            let type = Math.floor(Math.random() * 4); // Wählt eine der 4 Blüten-Gattungen
            let angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.2;
            
            // Startet mit einem massiven Stamm (Dicke: 18-24px, Länge: 150-250px)
            let len = 150 + Math.random() * 100;
            let width = 18 + Math.random() * 6;
            this.root = new BranchNode(x, y, angle, len, width, type, p, true, 0);
        }
        update() { this.root.update(); }
        drawStems(ctx) { this.root.drawStems(ctx); }
        drawBlooms(ctx) { this.root.drawBlooms(ctx); }
    }

    function spawnPlant(x, y) {
        plants.push(new CompletePlant(x, y));
        if (plants.length > 3) plants.shift(); // Max 3 Pflanzen, weil sie extrem aufwendig sind!
    }

    function triggerClear() { plants = []; }

    // --- EINGABEN ---
    let lastTap = 0;
    function handleTouch(e) {
        let now = Date.now();
        if (now - lastTap < 300) { triggerClear(); lastTap = 0; return; }
        lastTap = now;
        
        let x = e.clientX || (e.touches && e.touches[0].clientX);
        let y = e.clientY || (e.touches && e.touches[0].clientY);
        if(x !== undefined && y !== undefined) spawnPlant(x, y);
    }

    window.addEventListener('pointerdown', handleTouch);
    window.addEventListener('dblclick', triggerClear);

    // --- RENDER LOOP ---
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        plants.forEach(p => p.update());
        // Stämme im Hintergrund
        plants.forEach(p => p.drawStems(ctx));
        // Blüten im Vordergrund
        plants.forEach(p => p.drawBlooms(ctx));

        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
